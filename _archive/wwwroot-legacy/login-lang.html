<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إسكان الطلاب والطالبات - جامعة نجران</title>
<script src="i18n.js"></script>
<style>
  @font-face {
    font-family: 'IBM Plex Sans Arabic';
    font-style: normal;
    font-weight: 400;
    src: url('fonts/IBMPlexSansArabic-Regular.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Sans Arabic';
    font-style: normal;
    font-weight: 600;
    src: url('fonts/IBMPlexSansArabic-SemiBold.woff2') format('woff2');
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    padding: 16px 0;
  }
  html[dir="ltr"] body { justify-content: flex-start; padding-left: 8%; }
  html[dir="rtl"] body { justify-content: flex-start; padding-right: 8%; }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url('nni1.jpg') center/cover no-repeat;
    z-index: 0;
  }
  .lang-btn {
    position: absolute;
    top: 10px;
    background: #fff;
    border: 1px solid #e2e6ef;
    border-radius: 6px;
    padding: 8px 18px;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #1a2a5e;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    z-index: 3;
    margin: 0;
  }
  .lang-btn:hover {
    background: #f4f6fb;
  }
  [dir="rtl"] .lang-btn { left: 10px; }
  [dir="ltr"] .lang-btn { right: 10px; }
  .card {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.97);
    border-radius: 16px;
    padding: 24px 44px 16px;
    width: 432px;
    height: 752px;
    max-width: 95%;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
  }
  .card-header {
    text-align: center;
  }
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
    margin-top: 18px;
  }
  .logo-wrap img {
    width: 170px;
    height: auto;
  }
  .logo-text {
    font-size: 22px;
    font-weight: 600;
    color: #1a2a5e;
    line-height: 1.3;
  }
  .form { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .field { }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #1a2a5e;
    margin-bottom: 6px;
  }
  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%;
    height: 56px;
    background: #f4f6fb;
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 0 48px 0 16px;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    font-size: 16px;
    color: #1a2a5e;
    outline: none;
    transition: all 0.25s ease;
  }
  .input-wrap input::placeholder { color: #b0b8cc; }
  .input-wrap input:hover { background: #eef1f8; }
  .input-wrap input:focus {
    background: #fff;
    border-color: #1a2a5e;
    box-shadow: 0 0 0 4px rgba(26,42,94,0.1);
  }
  .input-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #b0b8cc;
    pointer-events: none;
    transition: color 0.25s ease;
  }
  .input-wrap input:focus ~ .input-icon { color: #1a2a5e; }
  .btn-login {
    width: 100%;
    height: 56px;
    background: linear-gradient(135deg, #0a0f1c 0%, #1a2a5e 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(10,15,28,0.35);
  }
  .btn-login::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a2a5e 0%, #2b3e7e 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .btn-login:hover::before { opacity: 1; }
  .btn-login:hover { box-shadow: 0 8px 28px rgba(10,15,28,0.45); transform: translateY(-1px); }
  .btn-login:active { transform: translateY(0); box-shadow: 0 4px 12px rgba(10,15,28,0.3); }
  .btn-login span { position: relative; z-index: 1; }
  .btn-login.loading { pointer-events: none; opacity: 0.85; }
  .btn-login .spinner {
    display: none;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    z-index: 1;
  }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  .btn-login.loading span { opacity: 0; }
  .btn-login.loading .spinner { display: block; }
  .forgot-link {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #8a94a6;
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .forgot-link:hover {
    color: #1a2a5e;
    text-decoration: underline;
  }
  [dir="rtl"] .forgot-link { text-align: right; }
  [dir="ltr"] .forgot-link { text-align: left; }
  .error-msg {
    display: none;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    padding: 10px 14px;
    text-align: center;
  }
  .error-msg.show { display: block; }
  .footer-text {
    text-align: center;
    font-size: 11px;
    color: #8C6B1F;
    font-weight: 600;
    margin-top: auto;
    line-height: 1.5;
    padding-top: 10px;
  }

  [dir="ltr"] .input-wrap input { padding: 0 14px 0 44px; }
  [dir="ltr"] .input-icon { right: auto; left: 14px; }

  @media (max-width: 480px) {
    .card { padding: 24px 28px 16px; width: 100%; height: auto; max-width: 430px; border-radius: 14px; }
    .logo-wrap img { width: 110px; }
    .logo-text { font-size: 16px; }
    .input-wrap input { height: 52px; font-size: 15px; }
    .btn-login { height: 52px; font-size: 15px; }
    body { padding: 12px 0; }
    html[dir="ltr"] body { padding-left: 5%; }
    html[dir="rtl"] body { padding-right: 5%; }
  }
  @media (max-width: 360px) {
    .card { padding: 20px 20px 14px; width: 100%; height: auto; }
    .logo-wrap img { width: 90px; }
    .logo-text { font-size: 14px; }
    .input-wrap input { height: 48px; padding: 0 10px 0 36px; font-size: 14px; }
    .input-icon { right: 10px; width: 16px; height: 16px; }
    [dir="ltr"] .input-icon { right: auto; left: 10px; }
    [dir="rtl"] .lang-btn { left: 8px; }
    [dir="ltr"] .lang-btn { right: 8px; }
    .btn-login { height: 48px; font-size: 14px; }
    .field label { font-size: 12px; }
    body { padding: 8px 0; }
    html[dir="ltr"] body { padding-left: 4%; }
    html[dir="rtl"] body { padding-right: 4%; }
  }
  @media (max-width: 320px) {
    .card { padding: 16px 16px 12px; width: 100%; height: auto; border-radius: 12px; }
    .logo-wrap img { width: 75px; }
    .logo-text { font-size: 13px; }
    .input-wrap input { height: 40px; padding: 0 8px 0 32px; font-size: 12px; border-radius: 8px; }
    .input-icon { right: 8px; width: 14px; height: 14px; }
    [dir="ltr"] .input-icon { right: auto; left: 8px; }
    [dir="rtl"] .lang-btn { left: 6px; }
    [dir="ltr"] .lang-btn { right: 6px; }
    .btn-login { height: 40px; font-size: 13px; border-radius: 8px; }
    .field label { font-size: 11px; margin-bottom: 4px; }
    .forgot-link { font-size: 11px; }
    .error-msg { font-size: 11px; padding: 8px 10px; }
    body { padding: 6px 0; }
    html[dir="ltr"] body { padding-left: 3%; }
    html[dir="rtl"] body { padding-right: 3%; }
  }
  .about-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.3s;padding:20px }
  .about-overlay.open { opacity:1;pointer-events:all }
  .about-modal { background:var(--white);border-radius:20px;max-width:420px;width:100%;position:relative;box-shadow:0 25px 60px rgba(0,0,0,0.3);overflow:hidden }
  .about-close { position:absolute;top:12px;right:16px;background:none;border:none;font-size:24px;color:rgba(255,255,255,0.6);cursor:pointer;z-index:2;line-height:1 }
  [dir="ltr"] .about-close { right:auto;left:16px }
  .about-close:hover { color:#fff }
  .about-header { background:linear-gradient(135deg,var(--navy-dark) 0%,#2b3e7e 100%);padding:32px 24px 24px;text-align:center }
  .about-header img { width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,0.2);object-fit:contain;background:var(--white);padding:8px }
  .about-body { padding:24px;text-align:center }
  .about-body h2 { font-size:16px;font-weight:800;color:var(--navy-dark);margin-bottom:16px }
  .about-badges { display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap }
  .about-badge { padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px }
  .about-badge-version { background:var(--navy);color:var(--white) }
  .about-badge-status { background:#E1F5EE;color:#0F6E56 }
  .about-meta { font-size:12px;color:var(--gray-500);margin-bottom:20px }
  .about-features { display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:right }
  [dir="ltr"] .about-features { text-align:left }
  .about-feature { font-size:12px;color:var(--gray-700);padding:6px 10px;background:var(--gray-50);border-radius:8px;font-weight:500 }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">English</button>
    <div class="logo-wrap">
      <img src="nu-logo.png" alt="Najran University">
      <div class="logo-text" id="logoTitle">نظام إسكان الطلاب والطالبات</div>
    </div>
  </div>
  <form class="form" onsubmit="handleLogin(event)">
    <div class="field">
      <label for="username" id="lblUser">اسم المستخدم</label>
      <div class="input-wrap">
        <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username" required>
        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
    </div>
    <div class="field">
      <label for="password" id="lblPass">كلمة المرور</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">
      <span id="btnText">تسجيل الدخول للنظام</span>
      <div class="spinner"></div>
    </button>
    <a href="forgot-password.html" class="forgot-link" id="forgotLink">نسيت كلمة المرور؟</a>
    <div class="error-msg" id="errorMsg"></div>
  </form>
  <div class="footer-text" id="footerText">عمادة التحول الرقمي ومصادر المعرفة - تقنية المعلومات - جامعة نجران 2026</div>
</div>
<script>
const langData = {
  ar: {
    dir: 'rtl',
    htmlLang: 'ar',
    btnLang: 'English',
    title: 'نظام إسكان الطلاب والطالبات - جامعة نجران',
    logoTitle: 'نظام إسكان الطلاب والطالبات',
    lblUser: 'اسم المستخدم',
    lblPass: 'كلمة المرور',
    userPlaceholder: 'أدخل اسم المستخدم',
    passPlaceholder: '••••••••',
    btnText: 'تسجيل الدخول للنظام',
    forgotLink: 'نسيت كلمة المرور؟',
    footerText: 'عمادة التحول الرقمي ومصادر المعرفة - تقنية المعلومات - جامعة نجران 2026',
    errRequired: 'يرجى إدخال اسم المستخدم وكلمة المرور',
    errInvalid: 'اسم المستخدم أو كلمة المرور غير صحيحة',
    errConnection: 'تعذر الاتصال بالخادم، يرجى المحاولة لاحقاً'
  },
  en: {
    dir: 'ltr',
    htmlLang: 'en',
    btnLang: 'العربية',
    title: 'Students Housing System - Najran University',
    logoTitle: 'Students Housing System',
    lblUser: 'Username',
    lblPass: 'Password',
    userPlaceholder: 'Enter your username',
    passPlaceholder: '••••••••',
    btnText: 'Sign In',
    forgotLink: 'Forgot Password?',
    footerText: 'Deanship of Digital Transformation & Knowledge Resources - IT - Najran University 2026',
    errRequired: 'Please enter username and password',
    errInvalid: 'Invalid username or password',
    errConnection: 'Connection error, please try again later'
  }
};

function applyLang(lang) {
  __baseSetLang(lang);
  const data = langData[lang];
  document.title = data.title;
  document.getElementById('langBtn').textContent = data.btnLang;
  document.getElementById('logoTitle').textContent = data.logoTitle;
  document.getElementById('footerText').textContent = data.footerText;
  document.getElementById('lblUser').textContent = data.lblUser;
  document.getElementById('lblPass').textContent = data.lblPass;
  document.getElementById('username').placeholder = data.userPlaceholder;
  document.getElementById('password').placeholder = data.passPlaceholder;
  document.getElementById('btnText').textContent = data.btnText;
  document.getElementById('forgotLink').textContent = data.forgotLink;
}

function toggleLang() {
  applyLang(window.currentLang === 'ar' ? 'en' : 'ar');
}

applyLang(localStorage.getItem('uiLanguage') || 'ar');

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errorMsg');
  err.classList.remove('show');
  btn.classList.add('loading');

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const data = langData[currentLang];

  if (!username || !password) {
    err.textContent = data.errRequired;
    err.classList.add('show');
    btn.classList.remove('loading');
    return;
  }

  try {
    const res = await fetch('/api/Auth/Login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const resData = await res.json();

    if (res.ok) {
      localStorage.removeItem('studentToken');
      localStorage.removeItem('studentUser');
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      localStorage.setItem('staffToken', resData.token);
      localStorage.setItem('staffUser', JSON.stringify(resData.user));
      window.location.href = 'dashboard.html';
    } else {
      err.textContent = resData.message || data.errInvalid;
      err.classList.add('show');
    }
  } catch (ex) {
    err.textContent = data.errConnection;
    err.classList.add('show');
  } finally {
    btn.classList.remove('loading');
  }
}
</script>
<script src="VersionInfo.js"></script>
<div class="about-overlay" id="aboutModal" onclick="if(event.target===this)closeAbout()">
  <div class="about-modal">
    <button onclick="closeAbout()" class="about-close">&times;</button>
    <div class="about-header">
      <img src="nu-logo.png" alt="جامعة نجران">
    </div>
    <div class="about-body">
      <div class="about-badges">
        <span class="about-badge about-badge-version">v<span id="aboutVersion">1.0.0</span></span>
        <span class="about-badge about-badge-status">Production Ready</span>
      </div>
      <h2 id="aboutSysName">نظام إسكان الطلاب والطالبات - جامعة نجران</h2>
      <div class="about-meta" id="aboutBuildDate">Build: 2026-07-01</div>
      <div class="about-features">
        <span data-ar="إدارة الطلاب" data-en="Student Management" class="about-feature">إدارة الطلاب</span>
        <span data-ar="سجل التدقيق" data-en="Audit Trail" class="about-feature">سجل التدقيق</span>
        <span data-ar="التقارير" data-en="Reports" class="about-feature">التقارير</span>
        <span data-ar="الطلبات" data-en="Requests" class="about-feature">الطلبات</span>
        <span data-ar="لوحة البيانات" data-en="Dashboard" class="about-feature">لوحة البيانات</span>
        <span data-ar="تصدير Excel" data-en="Excel Export" class="about-feature">تصدير Excel</span>
        <span data-ar="تتبع IP" data-en="IP Tracking" class="about-feature">تتبع IP</span>
        <span data-ar="أمني" data-en="Security" class="about-feature">أمني</span>
      </div>
    </div>
  </div>
</div>
<script>
function showAbout() {
  var lang = window.currentLang || document.documentElement.getAttribute('lang') || 'ar';
  document.getElementById('aboutSysName').textContent = lang === 'ar' ? (typeof SYSTEM_NAME_AR !== 'undefined' ? SYSTEM_NAME_AR : 'نظام إسكان الطلاب والطالبات - جامعة نجران') : (typeof SYSTEM_NAME_EN !== 'undefined' ? SYSTEM_NAME_EN : 'Students Housing System - Najran University');
  document.getElementById('aboutVersion').textContent = typeof APP_VERSION !== 'undefined' ? APP_VERSION : '1.0.0';
  document.getElementById('aboutBuildDate').textContent = 'Build: ' + (typeof BUILD_DATE !== 'undefined' ? BUILD_DATE : '2026-07-01');
  document.getElementById('aboutModal').classList.add('open');
}
function closeAbout() { document.getElementById('aboutModal').classList.remove('open'); }
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeAbout(); });
</script>
</body>
</html>
