<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نظام إسكان الطلاب والطالبات - جامعة نجران</title>
<script src="i18n.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
  }
  body {
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
    padding: 16px;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url('nni1.jpg') center/cover no-repeat;
    z-index: 0;
    filter: blur(2px);
    transform: scale(1.05);
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.35) 100%);
    z-index: 1;
  }
  .card {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.97);
    border-radius: 16px;
    padding: 44px 42px 38px;
    width: 100%;
    max-width: 440px;
    min-width: 280px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
  }
  .logo-wrap {
    text-align: center;
    margin-bottom: 32px;
    position: relative;
  }
  .logo-wrap::after {
    content: '';
    display: block;
    width: 60px;
    height: 2.5px;
    background: linear-gradient(90deg, transparent, #c9a84c, transparent);
    margin: 18px auto 0;
    border-radius: 2px;
  }
  .logo-wrap img {
    width: 150px;
    height: auto;
    display: inline-block;
    max-width: 80%;
  }
  .form { display: flex; flex-direction: column; }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #1a2a5e;
    margin-bottom: 6px;
  }
  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%;
    height: 50px;
    background: #f4f6fb;
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 0 14px 0 44px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    color: #1a2a5e;
    direction: rtl;
    outline: none;
    transition: all 0.25s ease;
  }
  .input-wrap input::placeholder {
    color: #b0b8cc;
    font-weight: 400;
  }
  .input-wrap input:hover { background: #eef1f8; }
  .input-wrap input:focus {
    background: #fff;
    border-color: #1a2a5e;
    box-shadow: 0 0 0 4px rgba(26,42,94,0.1);
  }
  .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #b0b8cc;
    pointer-events: none;
    transition: color 0.25s ease;
  }
  .input-wrap input:focus ~ .input-icon { color: #1a2a5e; }
  .btn-login {
    width: 100%;
    height: 52px;
    background: linear-gradient(135deg, #0a0f1c 0%, #1a2a5e 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(10,15,28,0.35);
    margin-top: 6px;
  }
  .btn-login::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a2a5e 0%, #2b3e7e 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .btn-login:hover::before { opacity: 1; }
  .btn-login:hover {
    box-shadow: 0 8px 28px rgba(10,15,28,0.45);
    transform: translateY(-1px);
  }
  .btn-login:active {
    transform: translateY(0);
    box-shadow: 0 4px 12px rgba(10,15,28,0.3);
  }
  .btn-login span { position: relative; z-index: 1; }
  .btn-login.loading { pointer-events: none; opacity: 0.85; }
  .btn-login .spinner {
    display: none;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    z-index: 1;
  }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  .btn-login.loading span { opacity: 0; }
  .btn-login.loading .spinner { display: block; }
  .error-msg {
    display: none;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    font-size: 13px;
    font-weight: 500;
    border-radius: 8px;
    padding: 10px 14px;
    text-align: center;
    margin-top: 14px;
  }
  .error-msg.show { display: block; }

  .lang-btn {
    position: absolute;
    top: 16px;
    left: 16px;
    padding: 6px 16px;
    border-radius: 8px;
    border: 1px solid #d0d5e0;
    background: rgba(255,255,255,0.9);
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: #1a2a5e;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 3;
    backdrop-filter: blur(4px);
  }
  .lang-btn:hover { background: #fff; border-color: #1a2a5e; }
  [dir="rtl"] .lang-btn { left: auto; right: 16px; }
  [dir="ltr"] .lang-btn { right: auto; left: 16px; }
  @media (max-width: 480px) {
    .card {
      padding: 32px 24px 28px;
      max-width: 430px;
      min-width: 0;
      border-radius: 14px;
    }
    .logo-wrap { margin-bottom: 26px; }
    .logo-wrap img { width: 130px; }
    .logo-wrap::after { width: 50px; margin-top: 14px; }
    .input-wrap input { height: 48px; font-size: 14px; }
    .btn-login { height: 48px; font-size: 15px; }
    .field { margin-bottom: 14px; }
    body { padding: 12px; }
  }
  @media (max-width: 360px) {
    .card { padding: 24px 16px 20px; }
    .logo-wrap img { width: 100px; }
    .logo-wrap { margin-bottom: 20px; }
    .input-wrap input { height: 44px; padding: 0 10px 0 36px; font-size: 13px; }
    .input-icon { left: 10px; width: 16px; height: 16px; }
    .btn-login { height: 44px; font-size: 14px; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 12px; }
    body { padding: 8px; }
  }
  @media (max-width: 320px) {
    .card { padding: 20px 12px 16px; border-radius: 12px; }
    .logo-wrap img { width: 85px; }
    .logo-wrap { margin-bottom: 16px; }
    .logo-wrap::after { width: 40px; margin-top: 10px; height: 2px; }
    .input-wrap input { height: 40px; padding: 0 8px 0 32px; font-size: 12px; border-radius: 8px; }
    .input-icon { left: 8px; width: 14px; height: 14px; }
    .btn-login { height: 40px; font-size: 13px; border-radius: 8px; }
    .field { margin-bottom: 10px; }
    .field label { font-size: 11px; margin-bottom: 4px; }
    .error-msg { font-size: 11px; padding: 8px 10px; margin-top: 10px; }
    body { padding: 6px; }
  }
  .about-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.3s;padding:20px }
  .about-overlay.open { opacity:1;pointer-events:all }
  .about-modal { background:var(--white);border-radius:20px;max-width:420px;width:100%;position:relative;box-shadow:0 25px 60px rgba(0,0,0,0.3);overflow:hidden }
  .about-close { position:absolute;top:12px;right:16px;background:none;border:none;font-size:24px;color:rgba(255,255,255,0.6);cursor:pointer;z-index:2;line-height:1 }
  [dir="ltr"] .about-close { right:auto;left:16px }
  .about-close:hover { color:#fff }
  .about-header { background:linear-gradient(135deg,var(--navy-dark) 0%,#2b3e7e 100%);padding:32px 24px 24px;text-align:center }
  .about-header img { width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,0.2);object-fit:contain;background:var(--white);padding:8px }
  .about-body { padding:24px;text-align:center }
  .about-body h2 { font-size:16px;font-weight:800;color:var(--navy-dark);margin-bottom:16px }
  .about-badges { display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap }
  .about-badge { padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px }
  .about-badge-version { background:var(--navy);color:var(--white) }
  .about-badge-status { background:#E1F5EE;color:#0F6E56 }
  .about-meta { font-size:12px;color:var(--gray-500);margin-bottom:20px }
  .about-features { display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:right }
  [dir="ltr"] .about-features { text-align:left }
  .about-feature { font-size:12px;color:var(--gray-700);padding:6px 10px;background:var(--gray-50);border-radius:8px;font-weight:500 }
</style>
</head>
<body>
<div class="card">
  <button class="lang-btn" id="langBtn" onclick="toggleLang()">English</button>
  <div class="logo-wrap">
    <img src="nu-logo.png" alt="جامعة نجران">
  </div>
  <form class="form" onsubmit="handleLogin(event)">
    <div class="field">
      <label for="username">اسم المستخدم</label>
      <div class="input-wrap">
        <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username" required>
        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
    </div>
    <div class="field">
      <label for="password">كلمة المرور</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">
      <span>تسجيل الدخول للنظام</span>
      <div class="spinner"></div>
    </button>
    <div class="error-msg" id="errorMsg"></div>
  </form>
</div>
<script>
const langData = {
  ar: {
    htmlLang: 'ar', dir: 'rtl',
    title: 'نظام إسكان الطلاب والطالبات - جامعة نجران',
    btnLang: 'English',
    lblUser: 'اسم المستخدم', userPlaceholder: 'أدخل اسم المستخدم',
    lblPass: 'كلمة المرور', passPlaceholder: '••••••••',
    btnText: 'تسجيل الدخول للنظام',
    errEmpty: 'يرجى إدخال اسم المستخدم وكلمة المرور',
    errGeneric: 'اسم المستخدم أو كلمة المرور غير صحيحة',
    errConn: 'تعذر الاتصال بالخادم، يرجى المحاولة لاحقاً'
  },
  en: {
    htmlLang: 'en', dir: 'ltr',
    title: 'Students Housing System - Najran University',
    btnLang: 'عربي',
    lblUser: 'Username', userPlaceholder: 'Enter username',
    lblPass: 'Password', passPlaceholder: '••••••••',
    btnText: 'Login',
    errEmpty: 'Please enter username and password',
    errGeneric: 'Invalid username or password',
    errConn: 'Connection error, please try again later'
  }
};

function applyLang(lang) {
  __baseSetLang(lang);
  const data = langData[lang];
  document.title = data.title;
  document.getElementById('langBtn').textContent = data.btnLang;
  document.querySelector('.field:first-child label').textContent = data.lblUser;
  document.getElementById('username').placeholder = data.userPlaceholder;
  document.querySelector('.field:nth-child(2) label').textContent = data.lblPass;
  document.getElementById('password').placeholder = data.passPlaceholder;
  document.getElementById('loginBtn').querySelector('span').textContent = data.btnText;
}

function toggleLang() {
  applyLang(window.currentLang === 'ar' ? 'en' : 'ar');
}

applyLang(localStorage.getItem('uiLanguage') || 'ar');

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errorMsg');
  err.classList.remove('show');
  btn.classList.add('loading');

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    err.textContent = langData[currentLang].errEmpty;
    err.classList.add('show');
    btn.classList.remove('loading');
    return;
  }

  try {
    const res = await fetch('/api/Auth/Login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.removeItem('studentToken');
      localStorage.removeItem('studentUser');
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      localStorage.setItem('staffToken', data.token);
      localStorage.setItem('staffUser', JSON.stringify(data.user));
      window.location.href = 'dashboard.html';
    } else {
      err.textContent = data.message || langData[currentLang].errGeneric;
      err.classList.add('show');
    }
  } catch (ex) {
    err.textContent = langData[currentLang].errConn;
    err.classList.add('show');
  } finally {
    btn.classList.remove('loading');
  }
}
</script>
<script src="VersionInfo.js"></script>
<div class="about-overlay" id="aboutModal" onclick="if(event.target===this)closeAbout()">
  <div class="about-modal">
    <button onclick="closeAbout()" class="about-close">&times;</button>
    <div class="about-header">
      <img src="nu-logo.png" alt="جامعة نجران">
    </div>
    <div class="about-body">
      <div class="about-badges">
        <span class="about-badge about-badge-version">v<span id="aboutVersion">1.0.0</span></span>
        <span class="about-badge about-badge-status">Production Ready</span>
      </div>
      <h2 id="aboutSysName">نظام إسكان الطلاب والطالبات - جامعة نجران</h2>
      <div class="about-meta" id="aboutBuildDate">Build: 2026-07-01</div>
      <div class="about-features">
        <span data-ar="إدارة الطلاب" data-en="Student Management" class="about-feature">إدارة الطلاب</span>
        <span data-ar="سجل التدقيق" data-en="Audit Trail" class="about-feature">سجل التدقيق</span>
        <span data-ar="التقارير" data-en="Reports" class="about-feature">التقارير</span>
        <span data-ar="الطلبات" data-en="Requests" class="about-feature">الطلبات</span>
        <span data-ar="لوحة البيانات" data-en="Dashboard" class="about-feature">لوحة البيانات</span>
        <span data-ar="تصدير Excel" data-en="Excel Export" class="about-feature">تصدير Excel</span>
        <span data-ar="تتبع IP" data-en="IP Tracking" class="about-feature">تتبع IP</span>
        <span data-ar="أمني" data-en="Security" class="about-feature">أمني</span>
      </div>
    </div>
  </div>
</div>
<script>
function showAbout() {
  var lang = window.currentLang || document.documentElement.getAttribute('lang') || 'ar';
  document.getElementById('aboutSysName').textContent = lang === 'ar' ? (typeof SYSTEM_NAME_AR !== 'undefined' ? SYSTEM_NAME_AR : 'نظام إسكان الطلاب والطالبات - جامعة نجران') : (typeof SYSTEM_NAME_EN !== 'undefined' ? SYSTEM_NAME_EN : 'Students Housing System - Najran University');
  document.getElementById('aboutVersion').textContent = typeof APP_VERSION !== 'undefined' ? APP_VERSION : '1.0.0';
  document.getElementById('aboutBuildDate').textContent = 'Build: ' + (typeof BUILD_DATE !== 'undefined' ? BUILD_DATE : '2026-07-01');
  document.getElementById('aboutModal').classList.add('open');
}
function closeAbout() { document.getElementById('aboutModal').classList.remove('open'); }
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeAbout(); });
</script>
</body>
</html>
