<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<link rel="icon" href="../favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأكيد التسجيل</title>
<script src="../i18n.js"></script>
<link rel="stylesheet" href="../css/portal.css">
  <link rel="stylesheet" href="../css/portal-touch.css">
  <style>






.portal-header{text-align:center;padding:28px 16px 0;width:100%;position:relative}
.portal-header img{width:80px;height:auto;margin-bottom:10px}
.portal-header h1{font-size:17px;font-weight:800;color:var(--navy-dark)}
.lang-btn{position:absolute;top:12px;background:#fff;border:1px solid #e2e6ef;border-radius:6px;padding:6px 14px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;z-index:10}
[dir="rtl"] .lang-btn{left:12px}
[dir="ltr"] .lang-btn{right:12px}
.lang-btn:hover{background:#f4f6fb}
.content{max-width:560px}

.card:hover{box-shadow:0 4px 20px rgba(27,42,94,0.09)}



.success-icon{width:72px;height:72px;background:var(--green-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}







.request-number{font-size:32px;font-weight:900;color:var(--navy);margin:16px 0;letter-spacing:2px}
.info-text{font-size:13px;color:var(--gray-500);line-height:1.8;margin-bottom:24px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.actions .btn{width:auto;min-width:140px}
@media(max-width:768px){.portal-header{padding:20px 16px 0}.portal-header img{width:64px}.portal-header h1{font-size:16px}.content{padding:16px}.card{padding:20px}.step-indicator{gap:6px}.step{width:30px;height:30px;font-size:12px}}
@media(max-width:414px){.card{border-radius:12px}.step{width:28px;height:28px;font-size:11px}.step-indicator{gap:4px}.actions{flex-direction:column}.actions .btn{width:100%}.request-number{font-size:24px}.info-text{font-size:12px}}
@media(max-width:375px){.content{padding:12px}.card{padding:16px;border-radius:10px}.btn{padding:10px 16px}.step{width:26px;height:26px;font-size:10px}.success-icon{width:56px;height:56px}.success-icon svg{width:28px;height:28px}.portal-header{padding:16px 12px 0}.portal-header img{width:56px}.portal-header h1{font-size:15px}}
</style>
</head>
<body>
<div class="portal-header">
<img src="../nu-logo.png" alt="جامعة نجران">
<h1>تم تقديم الطلب</h1>
<button class="lang-btn" id="langBtn" onclick="toggleLang()">English</button>
</div>
<div class="content">
<div class="card card-pad-lg card-center">
<div class="step-indicator">
<div class="step done"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="8" fill="#0F6E56"/><path d="M4.5 8L7 10.5L11.5 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="step done"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="8" fill="#0F6E56"/><path d="M4.5 8L7 10.5L11.5 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="step done"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="8" fill="#0F6E56"/><path d="M4.5 8L7 10.5L11.5 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="step done"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="8" fill="#0F6E56"/><path d="M4.5 8L7 10.5L11.5 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div>
<div class="success-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0F6E56" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
<h2 style="font-size:18px;font-weight:800;margin-bottom:4px">تم تقديم الطلب بنجاح</h2>
<p style="font-size:13px;color:var(--gray-500);margin-bottom:16px">رقم طلبك</p>
<div class="request-number" id="requestNumber">---</div>
<p class="info-text">سيتم مراجعة طلبك من قبل المشرف ومن ثم قسم الأمن السيبراني والإدارة.<br>يمكنك متابعة حالة طلبك عبر صفحة طلباتي أو باستخدام رقم الطلب.</p>
<div class="actions">
<a href="my-requests.html" class="btn btn-primary">طلباتي</a>
<a id="trackBtn" href="track-request.html" class="btn btn-gold">متابعة الطلب</a>
<a href="index.html" class="btn btn-outline">العودة للرئيسية</a>
</div>
</div>
</div>
<script>
setLang(localStorage.getItem('uiLanguage') || 'ar');
function toggleLang() { applyLang(window.currentLang === 'ar' ? 'en' : 'ar'); }
var reqNum = localStorage.getItem('lastRequestNumber') || '---';
document.getElementById('requestNumber').textContent = reqNum;
// ?req= هو الباراميتر اللي شاشة التتبع بتقراه فعلاً (?number= كان بيتجاهَل).
// لو الطالب لسه مخلّص الطلب دلوقتي، الشاشة بتفتحه على طول من غير تحقق؛
// بعد ما الوقت يعدّي بترجع تطلب منه آخر ٤ أرقام من جواله.
document.getElementById('trackBtn').href = 'track-request.html?req=' + encodeURIComponent(reqNum);
</script>
</body>
</html>
