<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<link rel="icon" href="../favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحقق برقم الجوال</title>
<script src="../i18n.js"></script>
<script src="../js/phone-field.js"></script>
<script src="../js/code-field.js"></script>
<link rel="stylesheet" href="../css/portal.css">
  <link rel="stylesheet" href="../css/portal-touch.css">
  <style>








.portal-header{text-align:center;padding:28px 16px 0;width:100%;position:relative}
.portal-header img{width:80px;height:auto;margin-bottom:10px}
.portal-header h1{font-size:17px;font-weight:800;color:var(--navy-dark)}
.lang-btn{position:absolute;top:12px;background:#fff;border:1px solid #e2e6ef;border-radius:6px;padding:6px 14px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;z-index:10}
[dir="rtl"] .lang-btn{left:12px}
[dir="ltr"] .lang-btn{right:12px}
.lang-btn:hover{background:#f4f6fb}
.content{max-width:520px}

.card:hover{box-shadow:0 4px 20px rgba(27,42,94,0.09)}




.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
.form-control{width:100%;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:10px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14px;transition:border-color 0.2s;height:48px}
.form-control:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,42,94,0.1)}



.btn-primary:disabled{opacity:0.5;cursor:not-allowed}






.timer-text{text-align:center;font-size:13px;color:var(--gray-500);margin-top:12px}
.otp-input{text-align:center;font-size:28px;letter-spacing:12px;direction:ltr;height:56px;font-weight:700}
/* خانة الجوال: مفتاح +966 ثابت مش قابل للتعديل، والطالب بيكتب ٩ أرقام تبدأ بـ 5.
   كده مفيش لبس بين 05 و 5 و966 ومفيش رقم غلط بيتبعت للسيرفر أصلاً. */
.phone-field{display:flex;align-items:stretch;direction:ltr;background:var(--white);
             border:1.5px solid var(--gray-200);border-radius:10px;overflow:hidden;
             transition:border-color .2s,box-shadow .2s}
.phone-field:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,42,94,.1)}
.phone-field.ok{border-color:var(--green)}
.phone-field.bad{border-color:#E2A9A9}
.phone-cc{display:flex;align-items:center;flex-shrink:0;padding:0 14px;background:var(--gray-50);
          border-right:1.5px solid var(--gray-200);font-size:14px;font-weight:700;
          color:var(--gray-700);letter-spacing:.5px;user-select:none}
.phone-input{flex:1;min-width:0;height:48px;padding:0 14px;border:none;outline:none;background:transparent;
             font-family:'IBM Plex Sans Arabic',sans-serif;font-size:16px;font-weight:600;
             letter-spacing:1.5px;color:var(--navy-dark)}
.phone-input::placeholder{font-weight:400;letter-spacing:1px;color:var(--gray-300)}
.phone-hint{font-size:11.5px;color:var(--gray-500);line-height:1.6}
.phone-hint.err{color:var(--red);margin-top:6px}
@media(max-width:768px){.portal-header{padding:20px 16px 0}.portal-header img{width:64px}.portal-header h1{font-size:16px}.content{padding:16px}.card{padding:20px}.step-indicator{gap:6px}.step{width:30px;height:30px;font-size:12px}}
@media(max-width:414px){.card{border-radius:12px}.step{width:28px;height:28px;font-size:11px}.step-indicator{gap:4px}}
@media(max-width:375px){.content{padding:12px}.card{padding:16px;border-radius:10px}.form-control{height:44px;font-size:16px}.btn{padding:10px 16px}.step{width:26px;height:26px;font-size:10px}.timer-text{font-size:12px}.portal-header{padding:16px 12px 0}.portal-header img{width:56px}.portal-header h1{font-size:15px}}
@media(max-width:320px){.card{padding:14px}.form-group label{font-size:12px}.form-control{font-size:14px;height:40px}.btn{font-size:13px;padding:8px 14px}}
</style>
</head>
<body>
<div class="portal-header">
<img src="../nu-logo.png" alt="جامعة نجران">
<h1>تسجيل الإسكان الجامعي</h1>
<button class="lang-btn" id="langBtn" onclick="toggleLang()">English</button>
</div>
<div class="content">
<div class="card card-pad-lg">
<div class="step-indicator">
<div class="step active"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" fill="#1B2A5E" stroke="#1B2A5E" stroke-width="2"/><circle cx="8" cy="8" r="3" fill="white"/></svg></div>
<div class="step">2</div>
<div class="step">3</div>
<div class="step">4</div>
</div>
<h2 style="font-size:18px;font-weight:800;margin-bottom:4px">التحقق برقم الجوال</h2>
<p style="font-size:13px;color:var(--gray-500);margin-bottom:20px">أدخل رقم جوالك لاستلام رمز التحقق</p>
<div id="alertMessage" class="alert"></div>
<div id="stepPhone">
<div class="form-group">
<label>رقم الجوال</label>
<div class="phone-field" id="phoneField">
  <span class="phone-cc">+966</span>
  <!-- ⚠️ من غير maxlength عن قصد: المتصفح بيقص اللصق *قبل* ما الكود ينظّفه،
       فلصق 0501234567 كان بيتقص لـ 050123456 ثم يشيل الصفر فيطلع ٨ أرقام.
       الحد الأقصى في NuhPhone.normalize — بيقص بعد التنظيف مش قبله. -->
  <input type="tel" id="mobileInput" class="phone-input" placeholder="5XXXXXXXX"
         inputmode="numeric" autocomplete="tel-national" dir="ltr"
>
</div>
<div class="phone-hint" id="phoneHint"></div>
</div>
<button id="sendOtpBtn" class="btn btn-block btn-primary" onclick="sendOtp()" disabled>إرسال رمز التحقق</button>
</div>
<div id="trackLinkWrap" style="display:none;text-align:center;margin-top:8px">
<a id="trackLink" class="btn btn-block btn-primary" href="track-request.html" style="text-decoration:none">متابعة الطلب</a>
</div>
<div id="stepOtp" style="display:none">
<div id="staticOtpNote" class="alert alert-info" style="display:none">خدمة الرسائل النصية قيد التفعيل. استخدم الرمز 123456 للتجربة.</div>
<div class="form-group">
<label>رمز التحقق</label>
<input type="text" id="otpInput" class="form-control otp-input" placeholder="------" maxlength="6" inputmode="numeric">
</div>
<button id="verifyOtpBtn" class="btn btn-block btn-primary" onclick="verifyOtp()">تحقق</button>
<div id="timerText" class="timer-text"></div>
<button id="resendBtn" class="btn btn-outline" style="margin-top:8px;display:none" onclick="sendOtp()">إعادة إرسال الرمز</button>
</div>
</div>
</div>
<script>
setLang(localStorage.getItem('uiLanguage') || 'ar');
function toggleLang() { applyLang(window.currentLang === 'ar' ? 'en' : 'ar'); }

let mobile = '';
let userData = JSON.parse(localStorage.getItem('studentUser') || '{}');
let token = localStorage.getItem('studentToken');

function showAlert(msg, type) {
  var el = document.getElementById('alertMessage');
  el.textContent = msg;
  el.className = 'alert alert-' + type;
}

// القاعدة كلها في js/phone-field.js — ملف واحد لكل شاشات النظام.
// زر «تحقق» يفضل مقفولًا حتى يكتمل الرمز — نفس قاعدة زر الإرسال فوق.
NuhCode.gate({ button: 'verifyOtpBtn', fields: [{ input: 'otpInput', length: 6, digits: true }] });

NuhPhone.attach({
  input: 'mobileInput', wrap: 'phoneField', hint: 'phoneHint', button: 'sendOtpBtn',
  messages: {
    start:  'رقم الجوال يجب أن يبدأ بالرقم 5 - بدون صفر وبدون 966',
    length: 'رقم الجوال يجب أن يتكوّن من ٩ أرقام'
  }
});

async function sendOtp() {
  var digits = NuhPhone.normalize(document.getElementById('mobileInput').value);
  if (!NuhPhone.isValid(digits)) { showAlert('يرجى إدخال رقم جوال صحيح مكوّن من ٩ أرقام يبدأ بالرقم 5', 'error'); return; }
  // بنبعت الصيغة الموحّدة 9665XXXXXXXX زي ما هي متخزّنة في قاعدة البيانات
  mobile = '966' + digits;
  var btn = document.getElementById('sendOtpBtn');
  btn.disabled = true; btn.textContent = 'جاري الإرسال...';
  try {
    var r = await fetch('/api/Otp/send', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({mobile:mobile}) });
    var d = await r.json();
    if (r.ok) {
      showAlert('تم إرسال رمز التحقق إلى +966 ' + digits, 'success');
      document.getElementById('stepPhone').style.display='none';
      document.getElementById('stepOtp').style.display='block';
      if (d.mode === 'static') {
        document.getElementById('staticOtpNote').style.display='block';
      }
      startTimer();
    } else { showAlert(d.message || 'فشل الإرسال', 'error'); btn.disabled=false; btn.textContent='إرسال رمز التحقق'; }
  } catch(e) { showAlert('تعذر الاتصال بالخادم', 'error'); btn.disabled=false; btn.textContent='إرسال رمز التحقق'; }
}

async function verifyOtp() {
  var code = document.getElementById('otpInput').value.trim();
  if (!code || code.length < 6) { showAlert('يرجى إدخال رمز التحقق كاملاً', 'error'); return; }
  var btn = document.getElementById('verifyOtpBtn');
  btn.disabled = true; btn.textContent = 'جاري التحقق...';
  try {
    var r = await fetch('/api/Otp/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({mobile:mobile, code:code}) });
    var d = await r.json();
    if (r.ok) {
      localStorage.setItem('regMobile', mobile);
      localStorage.removeItem('staffToken');
      localStorage.removeItem('staffUser');
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      if (d.token) {
        localStorage.setItem('studentToken', d.token);
        localStorage.setItem('studentUser', JSON.stringify(d.user));
      }

      // بنفحص وجود طلب مفتوح *هنا* بعد ما الطالب أثبت ملكية الرقم بالـ OTP،
      // بدل ما يملأ النموذج كله وبعدين يترفض في آخر خطوة.
      // (السيرفر بيفحص برضه عند الإرسال — ده مايستغناش عنه، لكنه بيوفّر على
      //  الطالب مجهود ضايع.)
      var openReq = await findOpenRequest(mobile, d.token);

      // الطلب اللي المراجع طلب فيه استكمال بيانات لازم يرجع للطالب يعدّله —
      // من غير كده الطلب بيقف في اللا مكان: خرج من طابور المراجعة والطالب
      // مالوش أي طريقة يكمّله.
      if (openReq && openReq.status === 'need_more_info' && openReq.id) {
        window.location.href = 'register-form.html?edit=' + encodeURIComponent(openReq.id);
        return;
      }

      var openNum = openReq ? (openReq.requestNumber || '') : null;
      if (openNum) {
        var msg;
        if (openReq.status === 'need_more_info')
          msg = 'لديك طلب قائم رقمه ' + openNum + ' بحاجة إلى استكمال بيانات - تابعه من صفحة تتبع الطلب.';
        else if (DONE_STATUSES.indexOf(openReq.status) !== -1)
          msg = 'أنت مسجَّل بالفعل في الإسكان الجامعي بموجب الطلب رقم ' + openNum + '. لا يمكن تقديم طلب جديد؛ للاستفسار يرجى مراجعة إدارة الإسكان.';
        else
          msg = 'لديك طلب قائم بالفعل رقمه ' + openNum + '. لا يمكن تقديم طلب جديد قبل اكتمال مراجعته أو رفضه؛ يمكنك متابعته من صفحة تتبع الطلب، وللاستفسار يرجى مراجعة إدارة الإسكان.';
        showAlert(msg, 'error');
        document.getElementById('stepOtp').style.display = 'none';
        document.getElementById('trackLinkWrap').style.display = 'block';
        document.getElementById('trackLink').textContent = 'متابعة الطلب ' + openNum;
        // بنمرّر رقم الطلب وآخر ٤ أرقام في الرابط عشان صفحة التتبع تفتح الطلب على طول
        // بدل ما الطالب يعيد كتابة الرقم اللي إحنا عارفينه أصلاً.
        var l4 = NuhPhone.last4(mobile);
        document.getElementById('trackLink').href =
          'track-request.html?req=' + encodeURIComponent(openNum) + '&last4=' + encodeURIComponent(l4);
        return;
      }

      window.location.href = 'register-declarations.html';
    } else { showAlert(d.message || 'رمز غير صحيح', 'error'); NuhCode.busy(btn, false); btn.textContent='تحقق'; }
  } catch(e) { showAlert('تعذر الاتصال بالخادم', 'error'); NuhCode.busy(btn, false); btn.textContent='تحقق'; }
}

// نفس قائمة الحالات المفتوحة في السيرفر (RegistrationService.OpenStatuses).
// الحالات المنتهية (مكتمل/مرفوض) مش مفتوحة — الطالب المرفوض لازم يقدر يقدّم تاني.
var OPEN_STATUSES = ['submitted','pending_supervisor','pending_cyber',
                     'cyber_review','cyber_approved','ready_for_provisioning','need_more_info'];

// الطلب المكتمل مش «مفتوح»، لكنه يعني إن الطالب مسجَّل بالفعل وله حساب شبكة.
// التسجيل من جديد بيتفتح تلقائيًا لما حالته تتغيّر (مغادرة / تخرّج / تحويل)،
// والسيرفر هو اللي بيحسم ده لأنه الوحيد اللي بيشوف حالة الطالب.
var DONE_STATUSES = ['completed','approved'];

// ⚠️ الفحص كان معتمدًا على مسار واحد فقط، وكان يُرجع null صامتًا عند أي فشل
//    (توكن ناقص، 401، شبكة) — فالطالب يعدّي للنموذج وعنده طلب مفتوح، ويترفض
//    في آخر خطوة بعد ما يملأ كل البيانات. بقى فيه مسارين:
//      ١) /api/Registration/my-requests — موثّق، وبيرجّع id (لازم لشاشة التعديل)
//      ٢) /api/RequestTracking/by-mobile — بدون توكن، احتياطي لو الأول فشل
//    الطالب أثبت ملكية الرقم بالـ OTP قبل الفحص، فالمسار التاني مش تسريب.
function canonicalMobile(mobileValue) {
  return NuhPhone.toStorage(mobileValue) || String(mobileValue || '');
}

function firstOpen(list, pick) {
  if (!list || !list.length) return null;
  for (var i = 0; i < list.length; i++) {
    if (OPEN_STATUSES.indexOf(list[i].status) !== -1) return pick(list[i]);
  }
  return null;
}

async function findOpenRequest(mobileValue, token) {
  var canonical = canonicalMobile(mobileValue);

  // (١) المسار الموثّق
  if (token) {
    try {
      var r = await fetch('/api/Registration/my-requests?mobile=' + encodeURIComponent(canonical),
                          { headers: { 'Authorization': 'Bearer ' + token } });
      if (r.ok) {
        var mine = await r.json();
        var hit = firstOpen(mine, function (x) { return x; });
        if (hit) return hit;
        if (mine && mine.length) {
          for (var k = 0; k < mine.length; k++) {
            if (DONE_STATUSES.indexOf(mine[k].status) !== -1) return mine[k];
          }
        }
      }
    } catch (e) { /* ننتقل للاحتياطي */ }
  }

  // (٢) الاحتياطي — بيرجّع رقم الطلب وحالته بدون id
  try {
    var r2 = await fetch('/api/RequestTracking/by-mobile/' + encodeURIComponent(canonical));
    if (!r2.ok) return null;
    var list2 = await r2.json();
    var open2 = firstOpen(list2, function (x) {
      return { id: null, requestNumber: x.requestNumber, status: x.status };
    });
    if (open2) return open2;

    // مفيش طلب مفتوح — نبصّ على المكتمل
    if (list2 && list2.length) {
      for (var j = 0; j < list2.length; j++) {
        if (DONE_STATUSES.indexOf(list2[j].status) !== -1)
          return { id: null, requestNumber: list2[j].requestNumber, status: list2[j].status };
      }
    }
    return null;
  } catch (e) {
    return null;   // السيرفر هو خط الدفاع الأخير عند الإرسال
  }
}

// Enter في خانة الجوال يبعت الرمز — من غيره الطالب لازم يمسك الماوس
document.getElementById('mobileInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !document.getElementById('sendOtpBtn').disabled) sendOtp();
});

function startTimer() {
  var sec = 300;
  var timer = setInterval(function() {
    var m = Math.floor(sec/60), s = sec%60;
    document.getElementById('timerText').textContent = 'انتهاء الصلاحية: ' + m + ':' + (s<10?'0':'') + s;
    if (sec <= 0) { clearInterval(timer); document.getElementById('timerText').textContent = 'انتهت صلاحية الرمز';
      document.getElementById('resendBtn').style.display = 'block'; }
    sec--;
  }, 1000);
}
</script>
</body>
</html>
