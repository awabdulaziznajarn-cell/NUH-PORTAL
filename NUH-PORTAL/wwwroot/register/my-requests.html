/* ⚠️ الأصناف باسم المرحلة الموحّد (Core/RequestWorkflow.cs) لا بالحالة الخام:
   pending_supervisor و submitted مرحلة واحدة، فلون واحد.
   وقبل كده كان ready_for_provisioning و completed **بلا لون خالص** - الشارة

.status-submitted{background:var(--gold-pale);color:var(--gold-dark)}
.status-cyber_review{background:#eff4ff;color:#175cd3}
.status-housing_approved{background:#eff4ff;color:#175cd3}
.status-ready_for_provisioning{background:var(--purple-light);color:var(--purple)}
.status-cyber_approved{background:var(--purple-light);color:var(--purple)}
.status-completed{background:var(--green-light);color:var(--green)}
.status-approved{background:var(--green-light);color:var(--green)}
.status-rejected{background:var(--red-light);color:var(--red)}
.status-need_more_info{background:#fffaeb;color:#b54708}
.tl{display:inline-flex;align-items:center;gap:0;direction:ltr;margin-top:4px}

<!-- ⚠️ data-i18n لا نصّ ثابت: الزرّ كان مكتوب فيه «English» بالإيد، فالطالب
     اللي بدّل للإنجليزي كان بيلاقي صفحة إنجليزي وزرّ بيعرض عليه «English»
     تاني - مفيش طريق راجع ظاهر للعربي. المفتاح pt_langToggle قيمته في
     الملف العربي «English» وفي الإنجليزي «العربية»، يعني نصّه دايمًا اسم
     اللغة اللي المستخدم رايح لها. -->
<button class="lang-btn" id="langBtn" type="button" onclick="toggleLang()" data-i18n="pt_langToggle">English</button>
</div>
<div class="content">
<div class="page-header">
<div>
<h2 data-i18n="pt_mrHead">طلبات التسجيل في الإسكان</h2>
<p data-i18n="pt_mrSub">جميع طلبات التسجيل المقدمة منك</p>
</div>
<div style="display:flex;gap:8px">
<a href="register-phone.html" class="btn btn-sm btn-primary" data-i18n="pt_mrNew">تسجيل جديد</a>
<a href="index.html" class="btn btn-sm btn-outline" data-i18n="pt_back">العودة</a>
</div>
</div>
<div class="card card-flush">
<table>
<thead><tr><th data-i18n="pt_mrColNumber">رقم الطلب</th><th data-i18n="pt_mrColStatus">الحالة</th><th data-i18n="pt_mrColDate">تاريخ التقديم</th><th></th><th></th></tr></thead>
<tbody id="requestsBody">
<tr><td colspan="5" class="empty-state" data-i18n="pt_loading">جاري التحميل...</td></tr>
</tbody>
</table>
</div>
</div>
<script>
setLang(localStorage.getItem('uiLanguage') || 'ar');
function toggleLang() { applyLang(window.currentLang === 'ar' ? 'en' : 'ar'); }
var token = localStorage.getItem('studentToken');

// ==========================================================================
//  حالة الطلب كما يراها الطالب.
//
//  ⚠️ الصفحة دي كانت كاتبة جدول المراحل بنفسها (PROGRESS_MAP) بسبع حالات،
//     والنظام عنده تسعة. الحالات الناقصة - cyber_review و cyber_approved
//     و housing_approved و housing_rejected و cyber_rejected و submitted -
//     كانت بتقع في السطر الأخير وتتطبع للطالب **زي ما هي**: كود قاعدة
//     البيانات cyber_review في خانة الحالة. وشاشة تتبّع الطلب - على بُعد
//     دوسة واحدة - كانت بتترجمها صح، فالطالب يشوف نفس الطلب بحالتين.
//
//  ⚠️ وكانت أرقام المراحل نفسها مفارِقة للخادم: pending_supervisor عند
//     الخادم خطوة ١ وهنا كانت صفر. نفس الغلط اللي اتصلّح في شاشات الموظفين
//     (الشرح في js/request-workflow.js) كان لسه عايش هنا.
//
//  الجدول دلوقتي بيتقرا من Core/RequestWorkflow.cs عبر NuhWorkflow، والنصّ
//  من Resources/*.resx. أي مرحلة تتضاف بكرة بتوصل للطالب من غير لمس الملف ده.
// ==========================================================================

// اسم المرحلة الموحّد: pending_supervisor و submitted مرحلة واحدة باسمين.
function stageName(status) {
  // ⚠️ الرفض له تلات أسماء في النظام (rejected / housing_rejected /
  //    cyber_rejected) وهو عند الطالب موقف واحد. القائمة من الخادم
  //    (Aliases("rejected")) لا مكتوبة هنا - من غير السطر ده كان الطالب
  //    المرفوض من الأمن السيبراني يشوف نصًّا عامًّا مكان «مرفوض».
  if (NuhWorkflow.isRejected(status)) return 'rejected';
  return NuhWorkflow.canonical(status);
}

// ⚠️ النصّ بيرجع للمفتاح نفسه لو ماكانش في الـ resx - وساعتها بنعرض
//    «قيد المعالجة» لا المفتاح ولا الكود الخام. ده ضمان إن الطالب مايشوفش
//    كود قاعدة بيانات مهما اتضاف من حالات.
function ptText(prefix, status) {
  var key = prefix + stageName(status);
  var v = t(key);
  if (v !== key) return v;
  var g = t(prefix + 'unknown');
  return g !== (prefix + 'unknown') ? g : '';
}

function statusText(status) { return ptText('pt_status_', status); }

// ⚠️ رقم الخطوة من الخادم (حقل Step) لا من جدول محلي. النقطة النشطة هي آخر
//    محطة **اتحققت**، والخادم بيعدّ المرحلة اللي الطلب واقف فيها - فبنطرح
//    واحد. والمكتمل استثناء: المحطة الأخيرة نفسها هي اللي اتحققت.
function progressOf(status) {
  if (NuhWorkflow.isRejected(status)) return -1;
  var s = stageName(status);
  if (s === 'completed' || s === 'approved') return 4;
  var step = NuhWorkflow.stepOf(status);
  return (typeof step === 'number') ? Math.max(0, step - 1) : 0;
}

function statusIcon(status) {
  if (NuhWorkflow.isRejected(status)) return '❌';
  var s = stageName(status);
  return (s === 'completed' || s === 'approved') ? '✅' : '⏳';
}

function renderTimeline(status) {
  var progress = progressOf(status);
  var cls = 'status-' + escHtml(stageName(status));
  var badge = '<span class="status-badge ' + cls + '">' +
              statusIcon(status) + ' ' + escHtml(statusText(status)) + '</span>';
  if (progress === -1) return badge;

  var html = '<div class="tl">';
  for (var i = 0; i < 5; i++) {
    if (i > 0) html += '<div class="tl-bar' + (i <= progress ? ' done' : '') + '"></div>';
    var dotCls = i < progress ? 'done' : (i === progress ? 'active' : '');
    html += '<div class="tl-dot ' + dotCls + '" title="' + escHtml(t('pt_stage_' + i)) + '"></div>';
  }
  html += '</div><div style="margin-top:4px">' + badge + '</div>';
  return html;
}

async function loadRequests() {
  try {
    var mobile = localStorage.getItem('regMobile') || '';
    var url = '/api/Registration/my-requests' + (mobile ? '?mobile=' + encodeURIComponent(mobile) : '');
    var r = await fetch(url, { headers: {'Authorization':'Bearer '+token} });
    // انتهت الجلسة: الطالب يروح لشاشة تتبع الطلب (يتحقق بآخر ٤ أرقام)،
    // مش لشاشة دخول الموظفين — دي مش بوابته أصلاً.
    if (r.status === 401) { window.location.href = 'track-request.html'; return; }
    var data = await r.json();
    var tbody = document.getElementById('requestsBody');
    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state">' + escHtml(t('pt_mrEmpty')) + '</td></tr>';
      return;
    }
    tbody.innerHTML = data.map(function(req) {
      var date = NuhFmt.date(req.submittedAt);
      var editBtn = req.status === 'need_more_info'
        ? '<a href="register-form.html?edit=' + req.id + '" class="btn btn-sm" style="background:var(--gold);color:var(--navy-dark)">' + escHtml(t('pt_mrEditResubmit')) + '</a>'
        : '';
      return '<tr><td><strong>' + req.requestNumber + '</strong></td>' +
        '<td>' + renderTimeline(req.status) + '</td>' +
        '<td>' + date + '</td>' +
        '<td>' + editBtn + '</td>' +
        '<td><a href="track-request.html" class="btn btn-sm" onclick="showDetail(\'' + safeNum(req.requestNumber) + '\');return false">' + escHtml(t('pt_mrView')) + '</a></td></tr>';
    }).join('');
  } catch(e) { document.getElementById('requestsBody').innerHTML = '<tr><td colspan="5" class="empty-state">' + escHtml(t('pt_loadFailed')) + '</td></tr>'; }
}

// أرقام الطلبات بصيغة 2026-000004 — أي شيء خارجها ما يتحطّش في onclick
function safeNum(v) { return String(v || '').replace(/[^0-9\-]/g, ''); }

// ⚠️ كان بيوديه على request-review.html — وهي شاشة *موظفين* فيها القائمة
//    الجانبية للنظام كله. الطالب كان بيشوف تنقّل لوحة التحكم وشاشات الإدارة.
//    دلوقتي بيروح لشاشة تتبع الطلب، وهي الواجهة المخصّصة له.
//    الطالب متحقَّق منه بالفعل في هذه الشاشة، فبنسلّم رقم الطلب لمرة واحدة
//    عشان تفتح له مباشرة من غير ما نطلب التحقق تاني.
function showDetail(number) {
  try { localStorage.setItem('openRequestNumber', String(number || '')); } catch (e) {}
  window.location.href = 'track-request.html';
}
// ⚠️ الرسم بيستنّى القاموس وجدول المسار: البوابة بتجيبهم بـ fetch، ولو
//    رسمنا قبلهم الطالب هيشوف مفاتيح خام مكان أسماء المراحل.
(window.__i18nReady || Promise.resolve()).then(loadRequests);

// إعادة الرسم عند تبديل اللغة أو التقويم - الصفوف مرسومة خلاص.
window.onLanguageChange = function () { loadRequests(); };
</script>

<!-- ===== إنهاء الجلسة عند الخمول =====
     نفس مهلة شاشات الموظفين (Core/SessionPolicy.cs). عند انتهائها تُمسح
     جلسة الطالب من المتصفح ويعود لبوابة الطلاب برسالة واضحة. -->
<script src="../js/idle-session.js"></script>
<script>
NuhIdle.start({
  minutes: 10,
  warnSeconds: 120,
  showExpiredPanel: true,          // تبقى الرسالة على الشاشة بدل تحويل صامت
  homeUrl: 'index.html',
  // ⚠️ مفتاح لا t('...'): السطر ده بيتنفّذ وقت تحليل السكربت، والقاموس
  //    لسه بيتجاب بـ fetch - فـ t() كانت بترجّع «pt_backToPortal» نفسها
  //    وتتكتب على الزرّ. NuhIdle بقت هي اللي بتترجم وقت العرض.
  homeLabelKey: 'pt_backToPortal',
  pingHeaders: function () {
    var t = localStorage.getItem('studentToken');
    return t ? { 'Authorization': 'Bearer ' + t } : {};
  },
  // جلسة الطالب في المتصفح — تُمسح عند الانتهاء بأي سبب
  onSessionEnd: function () {
    ['studentToken', 'studentUser', 'regMobile', 'lastRequestAt'].forEach(function (k) {
      try { localStorage.removeItem(k); } catch (e) {}
    });
  },
  onLogout: function () { window.location.replace('index.html'); }
});
</script>
</body>
