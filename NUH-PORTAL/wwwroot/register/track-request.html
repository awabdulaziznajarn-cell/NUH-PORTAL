.container{max-width:560px}

/* ⚠️ h2 لا h1: الصفحة كانت فيها عنوانان بوسم h1 — واحد للبوابة وواحد
   للصفحة — وباقي صفحات البوابة الستّ عنوان صفحتها h2. والمُحدِّد كان
   وسمًا عاريًا فكان بيمسك الاتنين. */
h2{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px}
.sub{font-size:13px;color:var(--gray-500);text-align:center;margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
.form-control{width:100%;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:10px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14px;height:48px;transition:border-color 0.2s}
.form-control:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(16,70,49,0.1)}



.btn-primary:disabled{opacity:.6;cursor:default}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;background:var(--gray-100);color:var(--gray-700)}
.tab.active{background:var(--navy);color:var(--white)}
.req-card{border:1px solid var(--gray-200);border-radius:12px;padding:18px;margin-top:14px}
.req-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.req-num{font-size:15px;font-weight:800;direction:ltr}
.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100)}
.info-row:last-of-type{border-bottom:none}
.info-label{font-size:12px;color:var(--gray-500)}
.info-value{font-size:13px;font-weight:600;color:var(--navy-dark)}
.status-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.status-submitted{background:var(--gold-pale);color:var(--gold-dark)}
.status-pending_supervisor{background:var(--gold-pale);color:var(--gold-dark)}
.status-pending_cyber{background:#eff4ff;color:#175cd3}
.status-ready_for_provisioning{background:var(--purple-light);color:var(--purple)}
.status-completed{background:var(--green-light);color:var(--green)}
.status-approved{background:var(--green-light);color:var(--green)}
.status-rejected{background:var(--red-light);color:var(--red)}
.status-need_more_info{background:#fffaeb;color:#b54708}
/* حالات مسار طلبات الموظف — من غيرها الشارة بتطلع بدون خلفية (نص سادة)
   لأن الكلاس status-{الحالة} مالوش تعريف، فالحالة كانت بتبان مختلفة عن الحالات التانية */
.status-cyber_review{background:#eff4ff;color:#175cd3}
.status-cyber_approved{background:var(--purple-light);color:var(--purple)}
.status-cyber_rejected{background:var(--red-light);color:var(--red)}
.status-housing_rejected{background:var(--red-light);color:var(--red)}
/* العنوان اتطلّع بره .timeline عشان الخط الرأسي ما يعديش جنبه، وبياخد نفس
   إزاحة عناوين المراحل (28px) فيبان في عمود واحد معاها. */
.timeline-title{font-size:13px;font-weight:700;color:var(--navy-dark);margin:16px 0 2px;padding-right:28px}
[dir="ltr"] .timeline-title{padding-right:0;padding-left:28px}
.timeline{margin-top:6px;position:relative}
.timeline::before{content:'';position:absolute;top:8px;bottom:8px;right:12px;width:2px;background:var(--gray-200)}
[dir="ltr"] .timeline::before{right:auto;left:12px}
.timeline-item{display:flex;gap:12px;padding:10px 0;position:relative;padding-right:28px}
[dir="ltr"] .timeline-item{padding-right:0;padding-left:28px}
.timeline-dot{width:12px;height:12px;border-radius:50%;background:var(--gray-300);margin-top:5px;flex-shrink:0;position:absolute;right:0;top:10px;z-index:1}
[dir="ltr"] .timeline-dot{right:auto;left:0}
.timeline-dot.completed{background:var(--green);border:2px solid var(--green-light)}
.timeline-dot.rejected{background:var(--red);border:2px solid var(--red-light)}
.timeline-content{flex:1}
.timeline-stage{font-size:13px;font-weight:600;color:var(--navy-dark)}
.timeline-date{font-size:11px;color:var(--gray-500);margin-top:2px}
/* بطاقة «الحالة الآن» — سطر واحد يقول للطالب فين طلبه وإيه اللي جاي.
   واحدة بس مش تحت كل خطوة: التكرار بيبقى ضوضاء والطالب بيبطّل يقراه. */
.now-box{margin-top:16px;border:1px solid #c6ecd6;background:#f3fcf6;border-radius:12px;padding:14px 16px;display:flex;gap:11px;align-items:flex-start}
.now-box svg{flex-shrink:0;margin-top:1px}
.now-title{font-size:13.5px;font-weight:700;color:var(--navy);line-height:1.7}
.now-text{font-size:12.5px;color:var(--gray-700);line-height:1.9;margin-top:2px}
/* ⚠️ .reject-box و.info-box كانا نسختين تانيتين من صندوق الملاحظة — الرابعة
   والخامسة في النظام. التعريف الوحيد بقى .note-block في components.css،
   والصفحة دي بتحمّله فوق. اللي فاضل هنا هو الزرّ وحده لأنه مش جزء من الصندوق. */
.info-box-btn{display:inline-block;margin-top:12px;background:#b54708;color:#fff;text-decoration:none;font-size:13px;font-weight:700;padding:10px 22px;border-radius:10px}
.done-box{margin-top:14px;border:2px solid var(--green);background:var(--green-light);padding:20px;border-radius:12px;text-align:center}




/* خانة الجوال — نفس تصميم شاشة التحقق: مفتاح +966 ثابت والطالب يكتب ٩ أرقام
   تبدأ بـ 5. توحيد الصيغة يمنع اللبس بين 05 و 5 و966 في الشاشتين معًا. */
.phone-field{display:flex;align-items:stretch;direction:ltr;background:var(--white);
             border:1.5px solid var(--gray-200);border-radius:10px;overflow:hidden;
             transition:border-color .2s,box-shadow .2s}
.phone-field:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(16,70,49,.1)}
.phone-field.ok{border-color:var(--green)}
.phone-field.bad{border-color:#f97066}
.phone-cc{display:flex;align-items:center;flex-shrink:0;padding:0 14px;background:var(--gray-50);
          border-right:1.5px solid var(--gray-200);font-size:14px;font-weight:700;
          color:var(--gray-700);letter-spacing:.5px;user-select:none}
.phone-input{flex:1;min-width:0;height:48px;padding:0 14px;border:none;outline:none;background:transparent;
             font-family:'IBM Plex Sans Arabic',sans-serif;font-size:16px;font-weight:600;
             letter-spacing:1.5px;color:var(--navy-dark)}
.phone-input::placeholder{font-weight:400;letter-spacing:1px;color:var(--gray-300)}
.phone-hint{font-size:11.5px;color:var(--red);line-height:1.6;margin-top:6px}
.nav-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--gray-500);text-decoration:none;margin-bottom:16px}
.nav-link svg{width:13px;height:13px;flex-shrink:0}
[dir=rtl] .nav-link svg{transform:scaleX(-1)}
.nav-link:hover{color:var(--navy)}
.empty{text-align:center;font-size:13px;color:var(--gray-500);padding:24px 0}
.hint{background:var(--gray-50);border:1px solid var(--gray-100);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.8;color:var(--gray-700);margin-bottom:14px}
.hint strong{color:var(--navy-dark);direction:ltr;display:inline-block}
.last4-input{text-align:center;letter-spacing:10px;font-size:22px;font-weight:700;direction:ltr}
.link-btn{background:none;border:none;color:var(--navy);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0;width:auto;margin-top:12px}
@media(max-width:768px){.container{padding:16px}.card{padding:20px}}

</style>

<script>
setLang(localStorage.getItem('uiLanguage') || 'ar');
function toggleLang() { applyLang(window.currentLang === 'ar' ? 'en' : 'ar'); }

/* ============================================================================
   تتبع الطلب — بحث برقم الطلب أو رقم الجوال، بدون تسجيل دخول.

   ملاحظة للمستقبل: /api/RequestTracking مفتوح بدون مصادقة وأرقام الطلبات
   متسلسلة (2026-000001, 000002, ...)، فنظريًا حد يقدر يعدّي عليها بالترتيب
   ويقرا أسماء الطلاب وحالات طلباتهم. اتقرر مؤقتًا نسيبها مفتوحة لحد ما
   الإدارة تحدد، لأن ربطها بـ OTP بيستهلك رصيد الرسائل المخصص للتسجيل.
   لو اتقرر التشديد لاحقًا: أرخص حل بدون أي رسائل هو طلب رقم الطلب + آخر
   ٤ أرقام من الجوال مع بعض — التخمين ساعتها بيبقى غير عملي.
   ============================================================================ */

var searchType = 'number';

function showAlert(msg, type) {
  var el = document.getElementById('alertMessage');
  el.textContent = msg || '';
  el.className = type ? 'alert alert-' + type : 'alert';
}

// credentials:'omit' مقصودة: الصفحة دي عامة ولازم تفضل مفصولة تمامًا عن أي
// جلسة موظف مفتوحة في نفس المتصفح. من غيرها المتصفح بيبعت كوكي NUH.Auth مع
// كل نداء، وده كان بيخلي السيرفر يتعامل مع الزائر كموظف.
async function apiFetch(url, opts) {
  opts = opts || {};
  opts.credentials = 'omit';
  var res = await fetch(url, opts);
  var body = null;
  try { body = JSON.parse(await res.text()); } catch (e) { body = null; }
  return { ok: res.ok, status: res.status, data: body };
}

// رسالة مفهومة بدل "تعذر الاتصال بالخادم" لكل حاجة — محدّد المعدل بيرد 429
// بجسم مش JSON، وكان بيتفسّر غلط كانقطاع اتصال.
function httpMessage(r, fallback) {
  if (r.status === 429) return t('pt_trkTooMany');
  if (r.data && r.data.message) return r.data.message;
  if (r.status >= 500) return t('pt_serverError');
  return fallback;
}

// ==========================================================================
//  أسماء المراحل - من جدول الخادم لا من قائمة هنا.
//
//  ⚠️ الصفحة دي كان فيها **قائمتين** لنفس الشيء: STATUS_MAP للحالة الحالية
//     و map جوّه getHistoryLabel لسطور المسار، وكل واحدة بتعدّ الحالات
//     بنفسها. وصفحة «طلباتي» كان فيها قائمة **تالتة** ناقصة ستّ حالات.
//     تلات نسخ لمفهوم واحد، وواحدة منهم كانت بتطبع للطالب كود قاعدة
//     البيانات. المصدر بقى Core/RequestWorkflow.cs، والنصّ من الـ resx.
//
//  ⚠️ والصياغة موحّدة عن قصد: «تمت موافقة إدارة …» في الخطوتين. المراجعة
//     متضمَّنة في الموافقة، وتوازي الصياغة هو اللي بيخلّي المسار يتقرأ مرتّبًا.
// ==========================================================================
function stageName(status) {
  // ⚠️ الرفض له تلات أسماء في النظام (rejected / housing_rejected /
  //    cyber_rejected) وهو عند الطالب موقف واحد. القائمة من الخادم
  //    (Aliases("rejected")) لا مكتوبة هنا - من غير السطر ده كان الطالب
  //    المرفوض من الأمن السيبراني يشوف نصًّا عامًّا مكان «مرفوض».
  if (NuhWorkflow.isRejected(status)) return 'rejected';
  return NuhWorkflow.canonical(status);
}

// ⚠️ لو المفتاح لسه ماتكتبش في الـ resx بنرجع لنصّ عام - الطالب مايشوفش
//    مفتاح ولا كود قاعدة بيانات مهما اتضاف من حالات.
function ptText(prefix, status) {
  var key = prefix + stageName(status);
  var v = t(key);
  if (v !== key) return v;
  var g = t(prefix + 'unknown');
  return g !== (prefix + 'unknown') ? g : '';
}

function getStatusLabel(status) { return ptText('pt_status_', status); }
function getHistoryLabel(toStage) { return ptText('pt_hist_', toStage); }

// شكل التاريخ من NuhFmt - نفس اللي بتقراه كل شاشة في النظام.
function fmtDateTime(v) { var d = NuhFmt.parse(v); return d ? NuhFmt.dateTime(d) : ''; }
function fmtDate(v) { var d = NuhFmt.parse(v); return d ? NuhFmt.date(d) : ''; }

// بعد ما النتيجة تظهر، خانات البحث مالهاش لازمة — بتاخد مساحة وبتشتّت.
// بنطويها ونسيب رابط للرجوع لبحث جديد.
function collapseSearch(on) {
  document.querySelector('.tabs').style.display = on ? 'none' : 'flex';
  document.getElementById('numberSearchGroup').style.display =
    on ? 'none' : (searchType === 'number' ? 'block' : 'none');
  document.getElementById('mobileSearchGroup').style.display =
    on ? 'none' : (searchType === 'mobile' ? 'block' : 'none');
  document.getElementById('newSearchWrap').style.display = on ? 'block' : 'none';
}

function newSearch() {
  collapseSearch(false);
  backToNumber();
}

function setSearchType(type) {
  searchType = type;
  // تصفير حالة خانة الجوال مع كل تبديل تبويب
  var __pf = document.getElementById('phoneField');
  if (__pf) { __pf.classList.remove('ok', 'bad'); }
  var __ph = document.getElementById('phoneHint');
  if (__ph) __ph.textContent = '';
  document.getElementById('tabNumber').classList.toggle('active', type === 'number');
  document.getElementById('tabMobile').classList.toggle('active', type === 'mobile');
  document.getElementById('numberSearchGroup').style.display = type === 'number' ? 'block' : 'none';
  document.getElementById('mobileSearchGroup').style.display = type === 'mobile' ? 'block' : 'none';
  document.getElementById('resultsList').innerHTML = '';
  collapseSearch(false);
  backToNumber();
  showAlert('');
}

// الخطوة الأولى (رقم الطلب) مابتلمسش السيرفر عن قصد.
// لو كانت بتتحقق من وجود الرقم قبل ما تسأل عن آخر ٤ أرقام، الرد نفسه كان
// هيبقى أداة تأكيد للمهاجم: يعدّي على الأرقام المتسلسلة ويعرف أنهي واحد موجود
// من غير ما يعرف الجوال. الاتنين بيتبعتوا مع بعض في نداء واحد.
function goToLast4() {
  var num = document.getElementById('requestNumberInput').value.trim();
  if (!num) { showAlert(t('pt_trkEnterNumber'), 'error'); return; }
  showAlert('');
  document.getElementById('numEcho').textContent = num;
  document.getElementById('numStep1').style.display = 'none';
  document.getElementById('numStep2').style.display = 'block';
  var l4 = document.getElementById('last4Input');
  l4.value = '';
  l4.focus();
}

function backToNumber() {
  document.getElementById('numStep1').style.display = 'block';
  document.getElementById('numStep2').style.display = 'none';
  document.getElementById('last4Input').value = '';
  document.getElementById('resultsList').innerHTML = '';
  showAlert('');
}

async function trackByNumber() {
  var num = document.getElementById('requestNumberInput').value.trim();
  var last4 = document.getElementById('last4Input').value.trim();
  var btn = document.getElementById('searchBtnNum');
  var list = document.getElementById('resultsList');
  showAlert('');

  if (!num) { backToNumber(); showAlert(t('pt_trkEnterNumber'), 'error'); return; }
  if (!/^\d{4}$/.test(last4)) { showAlert(t('pt_trkEnterLast4'), 'error'); return; }

  btn.disabled = true; btn.textContent = t('pt_trkSearching');
  list.innerHTML = '<div class="empty">' + escHtml(t('pt_trkSearching')) + '</div>';
  try {
    var r = await apiFetch('/api/RequestTracking/' + encodeURIComponent(num) + '?last4=' + encodeURIComponent(last4));
    if (r.status === 404) {
      // نفس الرسالة سواء الرقم غلط أو آخر ٤ أرقام غلط — السيرفر مابيفرّقش بينهم عن قصد
      list.innerHTML = ''; showAlert(t('pt_trkNotFound'), 'error');
    }
    else if (!r.ok || !r.data) { list.innerHTML = ''; showAlert(httpMessage(r, t('pt_trkSearchError')), 'error'); }
    else { list.innerHTML = renderFull(r.data); collapseSearch(true); }
  } catch (e) {
    list.innerHTML = ''; showAlert(t('reg_toastConnError'), 'error');
  }
  btn.disabled = false; btn.textContent = t('pt_trkSearch');
}

// القاعدة كلها في js/phone-field.js — نفس الملف اللي تستخدمه شاشة التحقق.
// تبويب «رقم الطلب» كان زرّه مفتوحًا دائمًا بينما تبويب «رقم الجوال» مقفول
// حتى يصحّ الرقم — نفس الشاشة وسلوكان. القاعدة واحدة الآن.
NuhCode.gate({ button: 'searchBtnNum', fields: [
  { input: 'requestNumberInput', test: function (v) { return v.length > 0; } },
  { input: 'last4Input', length: 4, digits: true }
]});

NuhPhone.attach({
  input: 'mobileInput', wrap: 'phoneField', hint: 'phoneHint', button: 'searchBtnMob',
  // ⚠️ دوال لا نصوص - نفس سبب صفحة التحقق من الجوال: القاموس يصل بعد
  //    تحميل السكربت، فالترجمة تُؤجَّل إلى لحظة العرض.
  messages: {
    start:  function () { return t('pt_phStart5'); },
    length: function () { return t('pt_phLen9'); }
  }
});

async function trackByMobile() {
  var digits = NuhPhone.normalize(document.getElementById('mobileInput').value);
  var btn = document.getElementById('searchBtnMob');
  var list = document.getElementById('resultsList');
  showAlert('');

  if (!NuhPhone.isValid(digits)) { showAlert(t('pt_phInvalid'), 'error'); return; }

  // الصيغة الموحّدة 9665XXXXXXXX — نفس المخزّن في قاعدة البيانات
  var mobile = '966' + digits;

  btn.disabled = true; btn.textContent = t('pt_trkSearching');
  list.innerHTML = '<div class="empty">' + escHtml(t('pt_trkSearching')) + '</div>';
  try {
    var r2 = await apiFetch('/api/RequestTracking/by-mobile/' + encodeURIComponent(mobile));
    if (r2.status === 404) { list.innerHTML = ''; showAlert(t('pt_trkNoneForMobile'), 'error'); }
    else if (!r2.ok || !r2.data) { list.innerHTML = ''; showAlert(httpMessage(r2, t('pt_trkSearchError')), 'error'); }
    else if (!r2.data.length) { list.innerHTML = ''; showAlert(t('pt_trkNoneForMobile'), 'error'); }
    else {
      // البحث برقم الجوال بيرجّع سطر مختصر لكل طلب من غير خطوات، فبنجيب تفاصيل
      // كل طلب لوحده عشان المسار وسبب الرفض يظهروا زي البحث برقم الطلب بالظبط.
      // آخر ٤ أرقام بتتاخد من الجوال اللي اتكتب — اللي عارف الجوال كامل عارفها.
      var last4 = digits.slice(-4);   // آخر ٤ أرقام من الرقم الوطني المكوَّن من ٩ خانات
      list.innerHTML = '';
      r2.data.forEach(function (item, i) {
        var holder = document.createElement('div');
        holder.id = 'trk-' + i;
        holder.innerHTML = renderSummary(item);
        list.appendChild(holder);
        loadTimeline(item, holder, last4);
      });
      collapseSearch(true);
    }
  } catch (e) {
    list.innerHTML = ''; showAlert(t('reg_toastConnError'), 'error');
  }
  btn.disabled = false; btn.textContent = t('pt_trkSearch');
}

async function loadTimeline(item, holder, last4) {
  var slot = holder.querySelector('.detail-slot');
  if (!slot) return;
  if (!item.requestNumber || !last4) { slot.innerHTML = ''; return; }
  try {
    var r = await apiFetch('/api/RequestTracking/' + encodeURIComponent(item.requestNumber) + '?last4=' + encodeURIComponent(last4));
    if (!r.ok || !r.data) { slot.innerHTML = ''; return; }
    slot.innerHTML = renderDetail(r.data);
  } catch (e) {
    slot.innerHTML = '';
  }
}

// بطاقة كاملة (نتيجة البحث برقم الطلب)
function renderFull(d) {
  return '<div class="req-card">' + headerRows(d) + renderDetail(d) + '</div>';
}

// بطاقة مختصرة + مكان للمسار (نتيجة البحث برقم الجوال)
function renderSummary(item) {
  return '<div class="req-card">' + headerRows(item) +
      '<div class="detail-slot"><div class="empty">' + escHtml(t('pt_trkLoadingPath')) + '</div></div>' +
    '</div>';
}

function headerRows(d) {
  var st = d.status || '';
  return '<div class="req-head">' +
      '<span class="req-num">' + escHtml(d.requestNumber || '') + '</span>' +
      '<span class="status-badge status-' + escHtml(stageName(st)) + '">' + escHtml(getStatusLabel(st)) + '</span>' +
    '</div>' +
    '<div class="info-row"><span class="info-label">' + escHtml(t('pt_trkStudent')) + '</span><span class="info-value">' + escHtml(d.studentName || '') + '</span></div>' +
    '<div class="info-row"><span class="info-label">' + escHtml(t('pt_trkSubmitDate')) + '</span><span class="info-value">' + fmtDate(d.submittedAt) + '</span></div>';
}

function renderDetail(d) {
  var html = '';
  var rejectionNotes = null;
  var infoNotes = null;

  if (d.history && d.history.length) {
    html += '<div class="timeline-title">' + escHtml(t('pt_trkStages')) + '</div><div class="timeline">';
    d.history.forEach(function (h) {
      // ⚠️ قائمة حالات الرفض من الخادم لا مكتوبة هنا: أي اسم رفض جديد كان
      //    هيعدّي كأنه خطوة ناجحة وياخد علامة ✓ خضرا في مسار الطالب.
      var isRejected = NuhWorkflow.isRejected(h.toStage);
      // سبب الرفض بيتاخد من خطوة الرفض نفسها — سواء جه من إدارة الإسكان
      // أو من الأمن السيبراني. الطالب لازم يشوفه عشان يعرف يصحّح إيه.
      if (isRejected && h.notes) rejectionNotes = h.notes;
      // المطلوب استكماله بيتاخد من خطوته — الطالب لازم يعرف يعدّل إيه بالظبط
      if (h.toStage === 'need_more_info' && h.notes) infoNotes = h.notes;
      html += '<div class="timeline-item">' +
          '<div class="timeline-dot ' + (isRejected ? 'rejected' : 'completed') + '"></div>' +
          '<div class="timeline-content">' +
            '<div class="timeline-stage">' + (isRejected ? '✕ ' : '✓ ') + escHtml(getHistoryLabel(h.toStage)) + '</div>' +
            '<div class="timeline-date">' + fmtDateTime(h.actionDate) + '</div>' +
          '</div>' +
        '</div>';
    });
    html += '</div>';
  }

  var st = d.status || '';

  html += renderNowBox(st);

  // الحالة "مرفوض" من غير سبب كانت بتسيب الطالب من غير أي إرشاد
  var isRejected = NuhWorkflow.isRejected(st);
  if (isRejected && rejectionNotes) {
    html += '<div class="note-block red">' +
        '<div class="note-block-cap">' + escHtml(t('pt_trkRejectReason')) + '</div>' +
        '<div class="note-block-txt">' + escHtml(rejectionNotes) + '</div>' +
      '</div>';
  }

  // «مطلوب استكمال بيانات» كانت بتظهر كحالة بس — من غير المطلوب إيه ولا إزاي
  // الطالب يكمّله. الزر بيوديه على شاشة التحقق بالجوال، وبعد الـ OTP النظام
  // بيفتحله طلبه في وضع التعديل مباشرة.
  if (st === 'need_more_info') {
    html += '<div class="note-block">' +
        '<div class="note-block-cap">' + escHtml(t('pt_trkNeedInfo')) + '</div>' +
        '<div class="note-block-txt">' + (infoNotes ? escHtml(infoNotes) : t('pt_trkNeedInfoDefault')) + '</div>' +
        '<a class="info-box-btn" href="register-phone.html">' + escHtml(t('pt_trkComplete')) + '</a>' +
      '</div>';
  }

  if (st === 'completed' || st === 'approved') {
    html += '<div class="done-box">' +
        '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#067647" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:8px"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' +
        '<h3 style="font-size:16px;color:#067647;margin-bottom:6px">' + escHtml(t('pt_trkAccountCreated')) + '</h3>' +
        // ⚠️ سطر «اسم المستخدم» اتشال. AdUsername كان اتشال من TrackingDetailsDto
        //    عشان الشاشة دي عامة بلا تسجيل دخول، فالسطر كان بيعرض «-» دايمًا.
        '<p style="font-size:13.5px;color:#333741;line-height:1.8">' + escHtml(t('pt_trkAccountSentSms')) + '</p>' +
      '</div>';
  }

  return html;
}

// ما الذي يحدث الآن. رسالة واحدة تتغيّر مع الحالة — مش سطر مكرّر تحت كل خطوة.
// الحالات اللي ليها بطاقة مخصّصة (مرفوض / بحاجة معلومات / مكتمل) مستثناة.
//
// ⚠️ كان تحت كل رسالة سطر «الخطوة التالية: …» وأُزيل عن قصد لسببين:
//    ١. وعد قد لا يتحقّق. الطلب في مرحلة الإسكان ممكن يُرفض أو يُطلب فيه
//       معلومات إضافية — فيكون النظام قال للطالب «التالي: الأمن السيبراني»
//       وحصل غير كده. الحالة الحالية حقيقة، والخطوة التالية توقّع.
//    ٢. تفاصيل داخلية لا تخصّ الطالب. أسماء الإدارات ومسار الطلب بينها ترتيب
//       داخلي — ولنفس السبب شِلنا أسماء الموظفين من مراحل التتبع.
//    الطالب يحتاج يعرف: وصل فين، ومطلوب منه إيه (غالبًا لا شيء). وده موجود.
// ⚠️ مفاتيح لا نصوص. الكائن يُبنى وقت تحميل السكربت، والقاموس يصل بعده
//    بـ fetch من /api/ui/i18n — و t() ترجّع المفتاح نفسه حين لا تجده. فكانت
//    القيم تتجمّد على المفتاح الخام، ويقرأ الطالب «pt_trkNowReview» مكان
//    «طلبك عند إدارة الأمن السيبراني» مهما وصل القاموس بعد ذلك.
//    الترجمة الآن وقت الرسم (renderNowBox) لا وقت البناء.
var NOW_STATE = {
  submitted:      { title: 'pt_trkNowHousing', text: 'pt_trkNowReviewTxt' },
  cyber_review:   { title: 'pt_trkNowReview',  text: 'pt_trkNowHousingOk' },
  cyber_approved: { title: 'pt_trkNowReady',   text: 'pt_trkNowReadyTxt'  }
};
NOW_STATE.pending_supervisor = NOW_STATE.submitted;
NOW_STATE.pending_cyber = NOW_STATE.cyber_review;
NOW_STATE.ready_for_provisioning = NOW_STATE.cyber_approved;

function renderNowBox(status) {
  var info = NOW_STATE[status];
  if (!info) return '';
  return '<div class="now-box">' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#166a45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
      '<div>' +
        '<div class="now-title">' + t(info.title) + '</div>' +
        '<div class="now-text">' + t(info.text) + '</div>' +
      '</div>' +
    '</div>';
}

// نافذة الثقة بعد التقديم: الطالب اللي لسه ضاغط "تقديم الطلب" من نفس المتصفح
// مش منطقي نطلب منه يتحقق تاني في نفس اللحظة. خلال النافذة دي بناخد آخر ٤
// أرقام من الجوال المتحقَّق منه في الخطوة الأولى ونفتح الطلب على طول. بعد
// انتهاء النافذة بيرجع المسار الطبيعي: يكتب آخر ٤ أرقام بنفسه.
// التحقق نفسه لسه بيتعمل على السيرفر — إحنا بنملا الخانة مش بنتخطاها.
var TRUST_WINDOW_MS = 30 * 60 * 1000; // ٣٠ دقيقة

// فتح مباشر من رابط: ?req=2026-000005[&last4=1234] — بييجي من شاشة التحقق أو
// من شاشة تأكيد التقديم، فمالوش لازمة يعيد كتابة بيانات إحنا عارفينها.
// ⚠️ مربوط بـ __i18nReady: الفتح المباشر بيرسم الحالة والمسار فورًا، ولو
//    اشتغل قبل ما القاموس وجدول المسار يوصلوا الطالب هيشوف نصوص عامة مكان
//    اسم مرحلته.
(window.__i18nReady || Promise.resolve()).then(function autoOpenFromUrl() {
  try {
    var q = new URLSearchParams(window.location.search);
    var req = q.get('req') || q.get('number');
    var l4 = q.get('last4');

    // تسليم لمرة واحدة من شاشة «طلباتي» — الطالب اتحقق هناك بالفعل.
    // بنقراه ونمسحه فورًا عشان ما يفضلش شغّال بعد كده.
    var handoff = null;
    try {
      handoff = localStorage.getItem('openRequestNumber');
      if (handoff) localStorage.removeItem('openRequestNumber');
    } catch (e) { handoff = null; }
    if (!req && handoff) req = handoff;

    if (!req) return;

    // مافيش last4 في الرابط؟ نجرّب نافذة الثقة قبل ما نطلبها من الطالب.
    // بنتأكد إن الرقم اللي في الرابط هو نفسه آخر طلب اتقدّم من المتصفح ده،
    // عشان الرابط ما يتبعتش لحد تاني ويفتح عنده من غير تحقق.
    if (!/^\d{4}$/.test(l4 || '')) {
      var savedNum = localStorage.getItem('lastRequestNumber') || '';
      var savedAt = parseInt(localStorage.getItem('lastRequestAt') || '0', 10);
      var savedMob = NuhPhone.normalize(localStorage.getItem('regMobile'));
      var fresh = savedAt > 0 && (Date.now() - savedAt) < TRUST_WINDOW_MS;
      var trusted = (fresh && savedNum === req) || (handoff && handoff === req);
      if (trusted && savedMob.length >= 4) l4 = savedMob.slice(-4);
    }

    document.getElementById('requestNumberInput').value = req;
    goToLast4();
    if (/^\d{4}$/.test(l4 || '')) {
      document.getElementById('last4Input').value = l4;
      trackByNumber();
    } else {
      // خارج نافذة الثقة: رقم الطلب متعبّي والمؤشر واقف على خانة التحقق.
      showAlert(t('pt_trkOwnerNote'), 'info');
    }
  } catch (e) { /* رابط غير صالح - الصفحة تفضل تشتغل عادي */ }
});

document.getElementById('requestNumberInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') goToLast4(); });
document.getElementById('last4Input').addEventListener('keydown', function (e) { if (e.key === 'Enter') trackByNumber(); });
document.getElementById('mobileInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !document.getElementById('searchBtnMob').disabled) trackByMobile();
});
</script>
