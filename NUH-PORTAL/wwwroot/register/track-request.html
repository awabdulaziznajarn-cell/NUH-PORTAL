<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<link rel="icon" href="../favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تتبع الطلب</title>
<script src="../i18n.js"></script>
<style>
@font-face { font-family:'IBM Plex Sans Arabic'; font-style:normal; font-weight:400; src:url('../fonts/IBMPlexSansArabic-Regular.woff2') format('woff2'); }
@font-face { font-family:'IBM Plex Sans Arabic'; font-style:normal; font-weight:600; src:url('../fonts/IBMPlexSansArabic-SemiBold.woff2') format('woff2'); }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
input,select,textarea{font-size:16px;-webkit-appearance:none;appearance:none;border-radius:0}
button{touch-action:manipulation}
:root{--navy:#1B2A5E;--navy-dark:#111C42;--navy-light:#2B3E7E;--gold:#C9A84C;--gold-light:#E8C96A;--white:#FFFFFF;--gray-50:#F4F6FB;--gray-100:#EEF1F8;--gray-200:#DDE3F0;--gray-300:#C8CFDF;--gray-500:#8891A8;--gray-700:#4A5270;--green:#0F6E56;--green-light:#E1F5EE;--red:#991B1B;--red-light:#FEF2F2}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--gray-50);color:var(--navy-dark);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.portal-header{text-align:center;padding:28px 16px 0;width:100%;position:relative}
.portal-header img{width:80px;height:auto;margin-bottom:10px}
.portal-header h1{font-size:17px;font-weight:800;color:var(--navy-dark)}
.lang-btn{position:absolute;top:12px;background:#fff;border:1px solid #e2e6ef;border-radius:6px;padding:6px 14px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;z-index:10}
[dir="rtl"] .lang-btn{left:12px}
[dir="ltr"] .lang-btn{right:12px}
.lang-btn:hover{background:#f4f6fb}
.container{padding:20px 16px;flex:1;max-width:560px;width:100%}
.card{background:var(--white);border-radius:16px;border:1px solid var(--gray-100);box-shadow:0 2px 8px rgba(27,42,94,0.05);padding:28px;transition:box-shadow 0.2s}
.card:hover{box-shadow:0 4px 20px rgba(27,42,94,0.09)}
h1{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px}
.sub{font-size:13px;color:var(--gray-500);text-align:center;margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
.form-control{width:100%;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:10px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14px;height:48px;transition:border-color 0.2s}
.form-control:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,42,94,0.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 24px;border-radius:10px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;border:none;width:100%}
.btn-primary{background:var(--navy);color:var(--white)}
.btn-primary:hover{background:var(--navy-light);transform:translateY(-1px)}
.result-card{margin-top:20px;display:none}
.info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--gray-100)}
.info-row:last-child{border-bottom:none}
.info-label{font-size:12px;color:var(--gray-500)}
.info-value{font-size:13px;font-weight:600;color:var(--navy-dark)}
.status-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.status-pending_supervisor{background:#FFF8E1;color:#B8860B}
.status-pending_cyber{background:#E3F2FD;color:#1565C0}
.status-pending_admin{background:#F3E5F5;color:#7B1FA2}
.status-approved{background:var(--green-light);color:var(--green)}
.status-rejected{background:var(--red-light);color:var(--red)}
.status-need_more_info{background:#FFF3E0;color:#E65100}
.timeline{margin-top:16px;position:relative}
.timeline::before{content:'';position:absolute;top:8px;bottom:8px;right:12px;width:2px;background:var(--gray-200)}
[dir="ltr"] .timeline::before{right:auto;left:12px}
.timeline-item{display:flex;gap:12px;padding:10px 0;position:relative;padding-right:28px}
[dir="ltr"] .timeline-item{padding-right:0;padding-left:28px}
.timeline-dot{width:12px;height:12px;border-radius:50%;background:var(--gray-300);margin-top:5px;flex-shrink:0;position:absolute;right:0;top:10px;z-index:1}
[dir="ltr"] .timeline-dot{right:auto;left:0}
.timeline-dot.completed{background:var(--green);border:2px solid var(--green-light)}
.timeline-content{flex:1}
.timeline-stage{font-size:13px;font-weight:600;color:var(--navy-dark)}
.timeline-date{font-size:11px;color:var(--gray-500);margin-top:2px}
.reject-box{margin-top:16px;border:1px solid var(--red);background:var(--red-light);padding:16px;border-radius:12px}
.reject-box-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--red);margin-bottom:6px}
.reject-box-text{font-size:13px;line-height:1.9;color:var(--navy-dark);white-space:pre-wrap;word-break:break-word}
.alert{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
.alert-error{background:var(--red-light);color:var(--red);border:1px solid var(--red);display:block}
.footer{text-align:center;font-size:11px;color:var(--gray-500);padding:20px;border-top:1px solid var(--gray-100);margin-top:auto;width:100%}
.nav-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--gray-500);text-decoration:none;margin-bottom:16px}
.nav-link:hover{color:var(--navy)}
@media(max-width:768px){.portal-header{padding:20px 16px 0}.portal-header img{width:64px}.portal-header h1{font-size:16px}.container{padding:16px}.card{padding:20px}}
@media(max-width:414px){.card{border-radius:12px}.info-row{padding:10px 0;flex-direction:column;gap:2px}.info-value{font-size:12px}}
@media(max-width:375px){.container{padding:12px;margin:0}.card{padding:16px;border-radius:10px}.form-control{height:44px;font-size:16px}h1{font-size:18px}.sub{font-size:12px;margin-bottom:16px}.portal-header{padding:16px 12px 0}.portal-header img{width:56px}.portal-header h1{font-size:15px}}
@media(max-width:320px){.card{padding:14px}.form-group label{font-size:12px}.form-control{font-size:14px;height:40px}.btn{font-size:13px;padding:8px 14px}h1{font-size:16px}}
</style>
</head>
<body>
<div class="portal-header">
<img src="../nu-logo.png" alt="جامعة نجران">
<h1>نظام إسكان الطلاب والطالبات</h1>
<button class="lang-btn" id="langBtn" onclick="toggleLang()">English</button>
</div>
<div class="container">
<div class="card">
<a href="index.html" class="nav-link">← العودة للرئيسية</a>
<h1>تتبع الطلب</h1>
<p class="sub">ابحث عن طلبك باستخدام رقم الطلب أو رقم الجوال</p>
<div id="alertMessage" class="alert"></div>
<div style="display:flex;gap:8px;margin-bottom:16px">
  <button id="searchTypeNumber" class="btn" style="flex:1;background:var(--navy);color:var(--white)" onclick="setSearchType('number')">رقم الطلب</button>
  <button id="searchTypeMobile" class="btn" style="flex:1;background:var(--gray-100);color:var(--gray-700)" onclick="setSearchType('mobile')">رقم الجوال</button>
</div>
<div class="form-group" id="numberSearchGroup">
<label>رقم الطلب</label>
<input type="text" id="requestNumberInput" class="form-control" placeholder="مثال: 2026-000001" dir="ltr" style="text-align:center">
</div>
<div class="form-group" id="mobileSearchGroup" style="display:none">
<label>رقم الجوال</label>
<input type="text" id="mobileInput" class="form-control" placeholder="05xxxxxxxx" dir="ltr" style="text-align:center" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
</div>
<button class="btn btn-primary" onclick="trackRequest()">بحث</button>
<div id="resultCard" class="result-card card" style="padding:24px">
<h3 style="font-size:16px;font-weight:700;margin-bottom:12px" id="resultTitle"></h3>
<div id="resultDetails"></div>
</div>
</div>
</div>
<div class="footer">عمادة التحول الرقمي ومصادر المعرفة - جامعة نجران 2026</div>
<script>
setLang(localStorage.getItem('uiLanguage') || 'ar');
function toggleLang() { applyLang(window.currentLang === 'ar' ? 'en' : 'ar'); }
function showAlert(msg, type) {
  var el = document.getElementById('alertMessage');
  el.textContent = msg;
  el.className = 'alert alert-' + type;
}

const STATUS_MAP = {
  submitted: 'تم تقديم الطلب',
  pending_supervisor: 'بانتظار موافقة إدارة الإسكان',
  pending_cyber: 'بانتظار مراجعة إدارة الأمن السيبراني',
  ready_for_provisioning: 'جاري إنشاء حساب شبكة السكن',
  completed: 'مكتمل',
  approved: 'مكتمل',
  rejected: 'مرفوض',
  need_more_info: 'بانتظار موافقة إدارة الإسكان'
};

// الملاحظات نص حر كتبه المراجع وبيتحقن بـ innerHTML — لازم يتهرّب.
// (اسم الطالب كان بيتحقن خام كمان، فبقى بيعدّي على نفس الدالة.)
function escHtml(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function getHistoryLabel(toStage) {
  var map = {
    pending_supervisor: 'تم تقديم الطلب',
    pending_cyber: 'تمت موافقة إدارة الإسكان',
    ready_for_provisioning: 'تمت مراجعة إدارة الأمن السيبراني',
    completed: 'مكتمل', approved: 'مكتمل', rejected: 'مرفوض'
  };
  return map[toStage] || STATUS_MAP[toStage] || toStage;
}

async function loadCompletionDetails(requestId) {
  var el = document.getElementById('adUsername');
  if (!requestId) { el.textContent = '-'; return; }
  var studentToken = localStorage.getItem('studentToken');
  if (!studentToken) { el.textContent = '-'; return; }
  try {
    var r = await fetch('/api/Registration/my-requests/' + requestId, { headers: { 'Authorization': 'Bearer ' + studentToken } });
    if (!r.ok) { el.textContent = '-'; return; }
    var data = await r.json();
    el.textContent = (data.student && data.student.ad_username) || '-';
  } catch(e) { el.textContent = '-'; }
}

var searchType = 'number';

function setSearchType(type) {
  searchType = type;
  var numBtn = document.getElementById('searchTypeNumber');
  var mobBtn = document.getElementById('searchTypeMobile');
  if (type === 'number') {
    numBtn.style.background = 'var(--navy)'; numBtn.style.color = 'var(--white)';
    mobBtn.style.background = 'var(--gray-100)'; mobBtn.style.color = 'var(--gray-700)';
    document.getElementById('numberSearchGroup').style.display = 'block';
    document.getElementById('mobileSearchGroup').style.display = 'none';
  } else {
    mobBtn.style.background = 'var(--navy)'; mobBtn.style.color = 'var(--white)';
    numBtn.style.background = 'var(--gray-100)'; numBtn.style.color = 'var(--gray-700)';
    document.getElementById('numberSearchGroup').style.display = 'none';
    document.getElementById('mobileSearchGroup').style.display = 'block';
  }
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('alertMessage').className = 'alert';
}

function renderRequests(requests) {
  var html = '';
  requests.forEach(function(d) {
    html += '<div style="padding:12px 0;border-bottom:1px solid var(--gray-100)">';
    html += '<div class="info-row"><span class="info-label">رقم الطلب</span><span class="info-value"><strong>' + d.requestNumber + '</strong></span></div>';
    html += '<div class="info-row"><span class="info-label">الحالة</span><span class="info-value"><span class="status-badge status-' + d.status + '">' + (STATUS_MAP[d.status] || d.status) + '</span></span></div>';
    html += '<div class="info-row"><span class="info-label">الطالب</span><span class="info-value">' + escHtml(d.studentName || '') + '</span></div>';
    html += '<div class="info-row"><span class="info-label">تاريخ التقديم</span><span class="info-value">' + new Date(d.submittedAt).toLocaleDateString('ar-SA') + '</span></div>';
    html += '</div>';
  });
  return html;
}

async function trackRequest() {
  document.getElementById('resultCard').style.display = 'none';
  if (searchType === 'number') {
    var num = document.getElementById('requestNumberInput').value.trim();
    if (!num) { showAlert('يرجى إدخال رقم الطلب', 'error'); return; }
    try {
      var r = await fetch('/api/RequestTracking/' + encodeURIComponent(num));
      if (r.status === 404) { showAlert('الطلب غير موجود', 'error'); return; }
      if (!r.ok) { showAlert('خطأ في البحث', 'error'); return; }
      var d = await r.json();
      var card = document.getElementById('resultCard');
      card.style.display = 'block';
      document.getElementById('alertMessage').className = 'alert';
      document.getElementById('resultTitle').textContent = 'طلب ' + d.requestNumber;
      var rejectionNotes = null;
      var html = '<div class="info-row"><span class="info-label">الحالة</span><span class="info-value"><span class="status-badge status-' + d.status + '">' + (STATUS_MAP[d.status] || d.status) + '</span></span></div>';
      html += '<div class="info-row"><span class="info-label">الطالب</span><span class="info-value">' + escHtml(d.studentName || '') + '</span></div>';
      html += '<div class="info-row"><span class="info-label">تاريخ التقديم</span><span class="info-value">' + new Date(d.submittedAt).toLocaleDateString('ar-SA') + '</span></div>';
      if (d.history && d.history.length > 0) {
        html += '<div class="timeline"><h4 style="font-size:13px;font-weight:700;margin:16px 0 8px">مسار الطلب</h4>';
        d.history.forEach(function(h) {
          var stageLabel = getHistoryLabel(h.toStage);
          var icon = h.toStage === 'rejected' ? '❌ ' : '✅ ';
          var dt = new Date(h.actionDate);
          var dateStr = dt.toLocaleDateString('en-GB') + ' ' + dt.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
          html += '<div class="timeline-item"><div class="timeline-dot completed"></div><div class="timeline-content"><div class="timeline-stage">' + icon + stageLabel + '</div><div class="timeline-date">' + dateStr + '</div><div style="font-size:12px;color:var(--gray-700);margin-top:2px">' + escHtml(h.actorName || '') + '</div></div></div>';
          // سبب الرفض بيتاخد من خطوة الرفض نفسها — سواء جه من إدارة الإسكان
          // أو من الأمن السيبراني. الطالب لازم يشوفه عشان يعرف يصحّح إيه.
          if (h.toStage === 'rejected' && h.notes) rejectionNotes = h.notes;
        });
        html += '</div>';
      }
      // الحالة "مرفوض" من غير سبب كانت بتسيب الطالب من غير أي إرشاد.
      if (d.status === 'rejected' && rejectionNotes) {
        html += '<div class="reject-box">' +
          '<div class="reject-box-title">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' +
            '\u0633\u0628\u0628 \u0627\u0644\u0631\u0641\u0636' +
          '</div>' +
          '<div class="reject-box-text">' + escHtml(rejectionNotes) + '</div>' +
        '</div>';
      }
      if (d.status === 'completed' || d.status === 'approved') {
        var username = d.adUsername || '-';
        html += '<div id="completionCard" style="margin-top:16px;border:2px solid #0F6E56;background:#E1F5EE;padding:20px;border-radius:12px;text-align:center">' +
          '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#0F6E56" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:8px"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' +
          '<h3 style="font-size:18px;color:#0F6E56;margin-bottom:8px">✅ تم إنشاء حساب شبكة السكن بنجاح</h3>' +
          '<p style="font-size:14px;color:#111C42;margin-bottom:4px">اسم المستخدم: <strong dir="ltr" style="display:inline-block;background:#fff;padding:4px 12px;border-radius:6px;border:1px solid #DDE3F0" id="adUsername">' + username + '</strong></p>' +
          '<p style="font-size:12px;color:#8891A8">تم إرسال بيانات الدخول إلى رقم الجوال المسجل بالنظام.</p>' +
        '</div>';
      }
      document.getElementById('resultDetails').innerHTML = html;
      if (d.status === 'completed' || d.status === 'approved') {
        loadCompletionDetails(d.id);
      }
    } catch(e) { showAlert('تعذر الاتصال بالخادم', 'error'); }
  } else {
    var mobile = document.getElementById('mobileInput').value.trim();
    if (!mobile) { showAlert('يرجى إدخال رقم الجوال', 'error'); return; }
    if (mobile.length < 10) { showAlert('يرجى إدخال رقم جوال صحيح (10 أرقام)', 'error'); return; }
    try {
      var r = await fetch('/api/RequestTracking/by-mobile/' + encodeURIComponent(mobile));
      if (r.status === 404) { showAlert('لا توجد طلبات مرتبطة بهذا الرقم', 'error'); return; }
      if (!r.ok) { showAlert('خطأ في البحث', 'error'); return; }
      var data = await r.json();
      var card = document.getElementById('resultCard');
      card.style.display = 'block';
      document.getElementById('alertMessage').className = 'alert';
      document.getElementById('resultTitle').textContent = 'نتائج البحث عن رقم ' + mobile;
      document.getElementById('resultDetails').innerHTML = renderRequests(data);
    } catch(e) { showAlert('تعذر الاتصال بالخادم', 'error'); }
  }
}

var autoNum = new URLSearchParams(window.location.search).get('number');
if (autoNum) {
  document.getElementById('requestNumberInput').value = autoNum;
  setSearchType('number');
  trackRequest();
}
</script>
</body>
</html>
