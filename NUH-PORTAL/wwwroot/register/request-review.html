<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../favicon.ico">
<title>تتبع الطلب</title>
<!--
  ============================================================================
  ⚠️ هذه الصفحة كانت شاشة مراجعة *للموظفين* موضوعة داخل مجلد بوابة الطالب،
     وكانت تحمّل القائمة الجانبية للنظام (sidebar.html) وأزرار الاعتماد
     والرفض. زر «عرض» في شاشة «طلباتي» كان يفتحها للطالب، فيرى تنقّل لوحة
     التحكم وشاشات الإدارة كاملة.

     الصفحة الآن مجرّد تحويل إلى شاشة تتبع الطلب — الواجهة المخصّصة للطالب.
     الموظفون يراجعون من /Requests/Details/{id} داخل النظام، وهي محمية
     بالصلاحيات على الخادم.

     تُركت الصفحة (بدلًا من حذفها) حتى لا تنكسر أي روابط قديمة محفوظة.
  ============================================================================
-->
<script>
  // نقل رقم الطلب المحفوظ من الرابط القديم إن وُجد، ثم التحويل
  try {
    var q = new URLSearchParams(window.location.search);
    var n = q.get('number') || q.get('req');
    if (n) localStorage.setItem('openRequestNumber', n);
  } catch (e) { /* رابط غير صالح — التحويل يتم على أي حال */ }
  window.location.replace('track-request.html');
</script>
</head>
<body>
<noscript><a href="track-request.html">الانتقال إلى شاشة تتبع الطلب</a></noscript>
</body>
</html>
